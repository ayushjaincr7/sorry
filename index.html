<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bappa, Saath Saath</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap');

:root{
  --bg-deep:#230F16;
  --bg-panel:#341B26;
  --bg-panel-2:#3E2230;
  --gold:#E3A857;
  --gold-bright:#F4C978;
  --vermillion:#C1443C;
  --ivory:#F5EAD9;
  --ivory-dim:#D8C4AE;
  --flame:#FFB74D;
  --flame-core:#FFE9B0;
  --shadow:rgba(0,0,0,.35);
  --radius-arch:28px 28px 14px 14px;
  --font-display:'Fraunces',serif;
  --font-body:'Work Sans',sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(circle at 50% -10%, var(--bg-panel-2), var(--bg-deep) 62%);
  color:var(--ivory);
  font-family:var(--font-body);
  min-height:100vh;
}
button{font:inherit;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 90px;}
.boot{text-align:center;padding:90px 20px;color:var(--ivory-dim);font-family:var(--font-display);font-size:18px;}

header.hero{text-align:center;padding:30px 12px 26px;}
header.hero .mark{width:88px;height:88px;margin:0 auto 8px;}
header.hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,7vw,38px);margin:0 0 6px;color:var(--gold-bright);letter-spacing:.2px;}
header.hero p.sub{color:var(--ivory-dim);font-size:14.5px;margin:0 0 14px;}
.dot-rule{height:6px;background-image:radial-gradient(circle, var(--gold) 1.5px, transparent 1.6px);background-size:14px 6px;opacity:.55;margin:0 auto;width:190px;}

.card{background:var(--bg-panel);border:1px solid rgba(227,168,87,.18);border-radius:var(--radius-arch);padding:24px 20px;margin-bottom:18px;box-shadow:0 10px 26px var(--shadow);position:relative;}
.card h2{font-family:var(--font-display);font-size:19px;margin:0 0 6px;color:var(--gold-bright);font-weight:600;}
.card p.hint{color:var(--ivory-dim);font-size:13.5px;line-height:1.5;margin:0 0 16px;}

label{display:block;font-size:13px;color:var(--ivory-dim);margin-bottom:6px;}
input[type=text]{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(227,168,87,.3);background:var(--bg-deep);color:var(--ivory);font-size:15px;margin-bottom:14px;font-family:var(--font-body);}
input::placeholder{color:var(--ivory-dim);opacity:.55;}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}

button.btn{font-weight:600;font-size:14.5px;padding:12px 20px;border-radius:100px;border:none;cursor:pointer;background:var(--vermillion);color:var(--ivory);}
button.btn.secondary{background:transparent;border:1.5px solid var(--gold);color:var(--gold-bright);}
button.btn:disabled{opacity:.5;cursor:default;}

.duration-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px;}
.duration-opt{border:1.5px solid rgba(227,168,87,.3);border-radius:16px;padding:11px;text-align:center;cursor:pointer;font-size:12.5px;line-height:1.5;}
.duration-opt.selected{border-color:var(--gold-bright);background:rgba(227,168,87,.12);color:var(--gold-bright);}

.diya-row{position:relative;display:flex;justify-content:center;gap:34px;align-items:flex-start;margin:8px 0 16px;}
.diya-unit{text-align:center;}
.diya-unit .name{font-size:12.5px;color:var(--ivory-dim);margin-top:8px;}
.diya-btn{width:82px;height:82px;border-radius:50%;border:2px solid var(--gold);background:var(--bg-panel-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease;padding:0;}
.diya-btn:hover:not([disabled]){transform:scale(1.04);}
.diya-btn.lit{background:radial-gradient(circle,var(--flame-core),var(--flame) 60%,var(--gold) 100%);box-shadow:0 0 22px 5px rgba(255,183,77,.5);}
.diya-btn[disabled]{cursor:default;}
.diya-btn svg{width:42px;height:42px;}
.diya-btn.lit .flame-icon{animation:flicker 1.6s ease-in-out infinite;}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.1) rotate(2deg);}}

.confetti-piece{position:absolute;width:6px;height:6px;border-radius:2px;top:38px;left:50%;pointer-events:none;animation:confetti-burst .9s ease-out forwards;}
@keyframes confetti-burst{to{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0;}}

.aarti-text summary{cursor:pointer;color:var(--gold-bright);font-weight:600;font-size:13.5px;}
.aarti-text p{font-size:13.5px;line-height:1.75;color:var(--ivory-dim);margin:12px 0;}

.modak-plate{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:30px;margin-bottom:14px;}

.notes-wall{display:flex;flex-direction:column;gap:9px;max-height:300px;overflow-y:auto;padding:2px 4px 2px 2px;}
.note{max-width:80%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.4;}
.note.mine{align-self:flex-end;background:var(--vermillion);color:var(--ivory);border-bottom-right-radius:4px;}
.note.theirs{align-self:flex-start;background:var(--bg-panel-2);border:1px solid rgba(227,168,87,.25);border-bottom-left-radius:4px;}
.note .meta{display:block;font-size:10.5px;opacity:.65;margin-top:4px;}

.timeline{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
.day-dot{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(227,168,87,.4);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--ivory-dim);background:transparent;}
.day-dot.today{border-color:var(--gold-bright);color:var(--gold-bright);font-weight:700;}
.day-dot.done{background:var(--gold);color:var(--bg-deep);border-color:var(--gold);font-weight:700;}

.who-btn{width:100%;margin-bottom:12px;text-align:center;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>
<div id="app"><div class="boot">Lighting the first diya&hellip;</div></div>
<script>
const START_DATE = new Date(2026,8,14);
const DURATIONS = [
  {days:1.5, label:'1.5 Days', endLabel:'Sep 15'},
  {days:3,   label:'3 Days',   endLabel:'Sep 16'},
  {days:5,   label:'5 Days',   endLabel:'Sep 18'},
  {days:7,   label:'7 Days',   endLabel:'Sep 20'},
  {days:10,  label:'10 Days \u00b7 Anant Chaturdashi', endLabel:'Sep 25'},
];

let SETUP = null, WHOAMI = null, TOTAL_DAYS = 0, TODAY_IDX = 0;
const appEl = document.getElementById('app');

function pad(n){ return String(n).padStart(2,'0'); }
function dateKeyFor(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayIndexFor(d){
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((a - START_DATE) / 86400000);
  return diff + 1;
}
function fmtDate(d){ return d.toLocaleDateString('en-IN', {day:'numeric', month:'short'}); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getMyRole(){ return WHOAMI === SETUP.personA ? 'personA' : 'personB'; }
function currentDuration(){ return DURATIONS.find(d => d.days === SETUP.durationDays) || DURATIONS[4]; }

async function sGet(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{
    await window.storage.set(key, JSON.stringify(value), shared);
    return true;
  }catch(e){ console.error('storage set failed', e); return false; }
}
async function safeDelete(key, shared){
  try{ await window.storage.delete(key, shared); }catch(e){ /* ignore */ }
}

function ganeshaMark(){
  return `<svg viewBox="0 0 200 200" width="88" height="88" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="100" rx="32" ry="38" fill="var(--gold)"/>
    <ellipse cx="150" cy="100" rx="32" ry="38" fill="var(--gold)"/>
    <circle cx="100" cy="106" r="56" fill="var(--gold-bright)"/>
    <path d="M100,150 Q88,175 100,192 Q110,200 100,184 Q98,172 106,164" stroke="var(--vermillion)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="84" cy="102" r="5" fill="var(--bg-deep)"/>
    <circle cx="116" cy="102" r="5" fill="var(--bg-deep)"/>
    <path d="M78,52 Q100,34 122,52" stroke="var(--vermillion)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="40" r="6" fill="var(--vermillion)"/>
  </svg>`;
}
function diyaSVG(){
  return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 40 Q32 58 54 40 Q46 48 32 48 Q18 48 10 40Z" fill="var(--gold)"/>
    <ellipse cx="32" cy="40" rx="22" ry="6" fill="var(--gold-bright)"/>
    <path class="flame-icon" d="M32 10 C26 20 24 26 30 32 C33 35 35 31 33 27 C38 30 40 22 32 10Z" fill="var(--flame)"/>
  </svg>`;
}
function modakSVG(){
  return `<svg viewBox="0 0 40 40" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-4px;margin-right:6px;">
    <path d="M20 6 C10 6 6 16 6 24 C6 32 12 36 20 36 C28 36 34 32 34 24 C34 16 30 6 20 6Z" fill="var(--gold)"/>
    <path d="M20 6 C17 10 17 14 20 16 C23 14 23 10 20 6Z" fill="var(--gold-bright)"/>
    <path d="M14 10 C12 12 12 15 15 16" stroke="var(--gold-bright)" stroke-width="1.5" fill="none"/>
    <path d="M26 10 C28 12 28 15 25 16" stroke="var(--gold-bright)" stroke-width="1.5" fill="none"/>
  </svg>`;
}
function heroHTML(subtitle){
  return `<header class="hero">
    <div class="mark">${ganeshaMark()}</div>
    <h1>Bappa, Saath Saath</h1>
    <p class="sub">${subtitle}</p>
    <div class="dot-rule"></div>
  </header>`;
}
function dayFlavor(idx, total){
  if(idx === 1) return 'Sthapana \u2014 Bappa moves in today.';
  if(idx === total) return 'The last day, before the sweetest goodbye.';
  const arr = [
    "Distance can't dim a flame lit with love.",
    'Every diya you light reaches further than you think.',
    'Bappa is watching over both your homes today.',
    'Small ritual, big togetherness.',
    'Another day, another reason to light up for each other.',
    'Halfway across the miles, right on time.'
  ];
  return arr[(idx - 2) % arr.length];
}
function noteHTML(n){
  const myRole = getMyRole();
  const mine = n.role === myRole;
  const authorName = mine ? 'You' : escapeHtml(SETUP[n.role]);
  return `<div class="note ${mine ? 'mine' : 'theirs'}"><span>${escapeHtml(n.text)}</span><span class="meta">${authorName} \u00b7 ${fmtDate(new Date(n.ts))}</span></div>`;
}
function notesWallHTML(notes){
  const items = notes.slice(-20).reverse().map(noteHTML).join('');
  return `<div class="notes-wall">${items || '<p class="hint" style="margin:0;">No notes yet \u2014 write the first one.</p>'}</div>`;
}
function noteFormHTML(){
  return `<form data-form="note" style="display:flex;gap:8px;margin-top:14px;">
    <input type="text" name="text" placeholder="Say something\u2026" maxlength="200" required style="margin-bottom:0;flex:1;">
    <button class="btn" type="submit">Send</button>
  </form>`;
}

async function getFestivalStats(){
  const fetches = [];
  for(let i = 0; i < TOTAL_DAYS; i++){
    const d = new Date(START_DATE); d.setDate(d.getDate() + i);
    fetches.push(sGet('ganpati-checkin-' + dateKeyFor(d), true));
  }
  const results = await Promise.all(fetches);
  const doneDays = results.map(c => !!(c && c.personA && c.personB));
  const together = doneDays.filter(Boolean).length;
  const isOver = TODAY_IDX > TOTAL_DAYS;
  let streak = 0;
  if(isOver){
    for(let i = doneDays.length - 1; i >= 0; i--){ if(doneDays[i]) streak++; else break; }
  }else{
    const priorCount = Math.max(0, Math.min(TODAY_IDX - 1, TOTAL_DAYS));
    for(let i = priorCount - 1; i >= 0; i--){ if(doneDays[i]) streak++; else break; }
  }
  return { doneDays, together, streak };
}

function setupHTML(){
  return `<div class="wrap">
    ${heroHTML('Your long-distance Ganeshotsav \u2014 Sthapana is ' + fmtDate(START_DATE))}
    <div class="card">
      <h2>Set up your corner for Bappa</h2>
      <p class="hint">Fill this in, then share this page's link with them and they'll join from their side. Anyone with the link can see and add to your shared aarti, modaks and notes.</p>
      <form data-form="setup">
        <label for="you-input">Your name</label>
        <input id="you-input" type="text" name="you" placeholder="e.g. Ayush" required maxlength="24">
        <label for="partner-input">Their name</label>
        <input id="partner-input" type="text" name="partner" placeholder="e.g. Dhari" required maxlength="24">
        <label>How many days will Bappa stay?</label>
        <div class="duration-grid">
          ${DURATIONS.map(d => `<div class="duration-opt${d.days === 10 ? ' selected' : ''}" data-action="select-duration" data-days="${d.days}">${d.label}<br><span style="opacity:.7">Visarjan ${d.endLabel}</span></div>`).join('')}
        </div>
        <input type="hidden" name="duration" value="10">
        <button class="btn" type="submit" style="width:100%;">Welcome Bappa home, together</button>
      </form>
    </div>
  </div>`;
}
function whoHTML(){
  return `<div class="wrap">
    ${heroHTML(escapeHtml(SETUP.personA) + ' & ' + escapeHtml(SETUP.personB) + "'s shared Ganeshotsav")}
    <div class="card" style="text-align:center;">
      <h2>Quick check \u2014 which one are you?</h2>
      <p class="hint">So we know whose diya is whose.</p>
      <button class="btn who-btn" type="button" data-action="choose-who" data-name="${escapeHtml(SETUP.personA)}">${escapeHtml(SETUP.personA)}</button>
      <button class="btn secondary who-btn" type="button" data-action="choose-who" data-name="${escapeHtml(SETUP.personB)}">${escapeHtml(SETUP.personB)}</button>
    </div>
  </div>`;
}
function countdownHTML(notes){
  const daysLeft = 1 - TODAY_IDX;
  const dur = currentDuration();
  return `<div class="wrap">
    ${heroHTML(escapeHtml(SETUP.personA) + ' & ' + escapeHtml(SETUP.personB))}
    <div class="card" style="text-align:center;">
      <h2>Bappa arrives in ${daysLeft} day${daysLeft === 1 ? '' : 's'}</h2>
      <p class="hint">Sthapana is ${fmtDate(START_DATE)}. You've chosen ${dur.days === 10 ? 'the full 10 days' : dur.label.toLowerCase()} \u2014 visarjan on ${dur.endLabel}. Come back once he's home to light the first diya, together.</p>
    </div>
    <div class="card">
      <h2>Leave an early note</h2>
      <p class="hint">Tell them you can't wait.</p>
      ${notesWallHTML(notes)}
      ${noteFormHTML()}
    </div>
  </div>`;
}
function todayHTML(checkin, modaks, notes, stats){
  const myRole = getMyRole();
  const isLastDay = TODAY_IDX === TOTAL_DAYS;
  const flavor = dayFlavor(TODAY_IDX, TOTAL_DAYS);
  const modakA = modaks.personA || 0, modakB = modaks.personB || 0;
  const modakTotal = modakA + modakB;
  const plateIcons = Array.from({length: Math.min(modakTotal, 21)}).map(() => `<span class="modak-icon">${modakSVG()}</span>`).join('');
  const dots = Array.from({length: TOTAL_DAYS}).map((_, i) => {
    const idx = i + 1;
    const cls = ['day-dot'];
    if(idx === TODAY_IDX) cls.push('today');
    if(stats.doneDays[i]) cls.push('done');
    return `<div class="${cls.join(' ')}">${idx}</div>`;
  }).join('');

  return `<div class="wrap">
    ${heroHTML(escapeHtml(SETUP.personA) + ' & ' + escapeHtml(SETUP.personB))}
    <div class="card" style="text-align:center;">
      <h2>Day ${TODAY_IDX} of ${TOTAL_DAYS}</h2>
      <p class="hint">${fmtDate(new Date())} \u00b7 ${flavor}</p>
    </div>
    <div class="card">
      <h2>Aarti, together</h2>
      <p class="hint">Light your diya. When you're both lit, Bappa's watching over two homes at once.</p>
      <div class="diya-row">
        <div class="diya-unit">
          <button class="diya-btn ${checkin.personA ? 'lit' : ''}" type="button" data-action="light-diya" data-role="personA" ${myRole !== 'personA' ? 'disabled' : ''}>${diyaSVG()}</button>
          <div class="name">${escapeHtml(SETUP.personA)}${myRole === 'personA' ? ' \u00b7 you' : ''}</div>
        </div>
        <div class="diya-unit">
          <button class="diya-btn ${checkin.personB ? 'lit' : ''}" type="button" data-action="light-diya" data-role="personB" ${myRole !== 'personB' ? 'disabled' : ''}>${diyaSVG()}</button>
          <div class="name">${escapeHtml(SETUP.personB)}${myRole === 'personB' ? ' \u00b7 you' : ''}</div>
        </div>
      </div>
      <div style="text-align:center;margin-bottom:4px;">
        <button class="btn secondary" type="button" data-action="ring-bell">Ring the bell</button>
      </div>
      ${stats.streak > 0 ? `<p style="text-align:center;color:var(--gold-bright);font-weight:600;margin:12px 0 0;">${stats.streak}-day streak, lit together</p>` : ''}
      <details class="aarti-text" style="margin-top:16px;">
        <summary>Sukhkarta Dukhharta \u2014 read along</summary>
        <p>Sukhkarta Dukhharta, Varta Vighnachi<br>Nurvi Purvi Prem Krupa Jayachi<br>Sarvangi Sundar Uti Shendurachi<br>Kanti Jhalke Mal Mukta Phalachi</p>
        <p><em>Jai Deva Jai Deva, Jai Mangalmurti<br>Darshanamatre Manakamana Purti</em></p>
        <p>Ratnakhachit Phara Tuj Gaurikumra<br>Chandanachi Uti Kumkumkeshara<br>Hi Phal Paane Rishi Muni Dolyara<br>Runadheen Atrisa Bhaktichya Para</p>
        <p><em>Jai Deva Jai Deva, Jai Mangalmurti<br>Darshanamatre Manakamana Purti</em></p>
      </details>
    </div>
    <div class="card">
      <h2>Offer a modak</h2>
      <p class="hint">His favourite. Offer one each, any time today.</p>
      <div class="modak-plate">${plateIcons || '<p class="hint" style="margin:0;">The plate is empty \u2014 be the first today.</p>'}</div>
      <div style="text-align:center;">
        <button class="btn" type="button" data-action="offer-modak">${modakSVG()}Offer a modak</button>
      </div>
      <p style="text-align:center;color:var(--ivory-dim);font-size:12.5px;margin-top:10px;">${escapeHtml(SETUP.personA)}: ${modakA} &nbsp;\u00b7&nbsp; ${escapeHtml(SETUP.personB)}: ${modakB}</p>
    </div>
    <div class="card">
      <h2>Notes to each other</h2>
      <p class="hint">Little things you'd say if the miles weren't there.</p>
      ${notesWallHTML(notes)}
      ${noteFormHTML()}
    </div>
    <div class="card">
      <h2>Your journey</h2>
      <div class="timeline">${dots}</div>
    </div>
    ${isLastDay ? `<div class="card" style="text-align:center;">
      <h2>Ready to say goodbye for now?</h2>
      <p class="hint">Do today's aarti together first, then begin the visarjan whenever you're both ready.</p>
      <button class="btn" type="button" data-action="begin-visarjan">Begin visarjan, together</button>
    </div>` : ''}
  </div>`;
}
function farewellHTML(stats, modaks, notesCount){
  const modakA = modaks.personA || 0, modakB = modaks.personB || 0;
  const modakTotal = modakA + modakB;
  return `<div class="wrap">
    ${heroHTML('Ganpati Bappa Morya')}
    <div class="card" style="text-align:center;">
      <h2>Ganpati Bappa Morya, Pudhchya Varshi Lavkar Ya</h2>
      <p class="hint">Hail Lord Ganesha \u2014 come again soon next year. ${escapeHtml(SETUP.personA)} and ${escapeHtml(SETUP.personB)} brought him home together this year, even from a distance.</p>
    </div>
    <div class="card">
      <h2>This year, together</h2>
      <p class="hint" style="margin-bottom:0;">
        \ud83e\udee1 ${stats.together} of ${TOTAL_DAYS} days, both diyas lit<br>
        \ud83d\udd25 Best streak: ${stats.streak} day${stats.streak === 1 ? '' : 's'} in a row<br>
        ${modakSVG()}${modakTotal} modaks offered (${escapeHtml(SETUP.personA)}: ${modakA}, ${escapeHtml(SETUP.personB)}: ${modakB})<br>
        \ud83d\udc8c ${notesCount} note${notesCount === 1 ? '' : 's'} sent to each other
      </p>
    </div>
    <div class="card" style="text-align:center;">
      <p class="hint">Starting over for next year?</p>
      <button class="btn secondary" type="button" data-action="reset-all">Start fresh for next year</button>
    </div>
  </div>`;
}

async function render(){
  if(!SETUP){ appEl.innerHTML = setupHTML(); return; }
  if(!WHOAMI){ appEl.innerHTML = whoHTML(); return; }
  const visarjan = await sGet('ganpati-visarjan', true);
  const isFarewell = (visarjan && visarjan.done) || TODAY_IDX > TOTAL_DAYS;
  if(isFarewell){
    const stats = await getFestivalStats();
    const modaks = (await sGet('ganpati-modaks', true)) || {personA:0, personB:0};
    const notes = (await sGet('ganpati-notes', true)) || [];
    appEl.innerHTML = farewellHTML(stats, modaks, notes.length);
    return;
  }
  if(TODAY_IDX < 1){
    const notes = (await sGet('ganpati-notes', true)) || [];
    appEl.innerHTML = countdownHTML(notes);
    return;
  }
  const todayKey = dateKeyFor(new Date());
  const checkin = (await sGet('ganpati-checkin-' + todayKey, true)) || {personA:false, personB:false};
  const modaks = (await sGet('ganpati-modaks', true)) || {personA:0, personB:0};
  const notes = (await sGet('ganpati-notes', true)) || [];
  const stats = await getFestivalStats();
  appEl.innerHTML = todayHTML(checkin, modaks, notes, stats);
}

function updateDurationSelection(t){
  const grid = t.parentElement;
  grid.querySelectorAll('.duration-opt').forEach(el => el.classList.remove('selected'));
  t.classList.add('selected');
  const form = t.closest('form');
  form.querySelector('input[name=duration]').value = t.dataset.days;
}
async function submitSetup(form){
  const you = form.you.value.trim();
  const partner = form.partner.value.trim();
  const duration = Number(form.duration.value);
  if(!you || !partner) return;
  const obj = {personA: you, personB: partner, durationDays: duration, createdAt: Date.now()};
  await sSet('ganpati-setup', obj, true);
  await sSet('ganpati-whoami', {name: you}, false);
  SETUP = obj; WHOAMI = you;
  TOTAL_DAYS = Math.ceil(currentDuration().days);
  TODAY_IDX = dayIndexFor(new Date());
  render();
}
async function submitNote(form){
  const text = form.text.value.trim();
  if(!text) return;
  const notes = (await sGet('ganpati-notes', true)) || [];
  notes.push({role: getMyRole(), text, ts: Date.now()});
  if(notes.length > 300) notes.splice(0, notes.length - 300);
  await sSet('ganpati-notes', notes, true);
  form.reset();
  render();
}
async function chooseWho(name){
  await sSet('ganpati-whoami', {name}, false);
  WHOAMI = name;
  render();
}
function celebrate(){
  const row = document.querySelector('.diya-row');
  if(!row) return;
  for(let i = 0; i < 18; i++){
    const s = document.createElement('span');
    s.className = 'confetti-piece';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 80;
    s.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    s.style.setProperty('--rot', (Math.random() * 360) + 'deg');
    s.style.background = Math.random() > 0.5 ? 'var(--gold)' : 'var(--vermillion)';
    row.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}
async function lightDiya(role){
  if(role !== getMyRole()) return;
  const key = 'ganpati-checkin-' + dateKeyFor(new Date());
  const cur = (await sGet(key, true)) || {personA:false, personB:false};
  const wasBoth = !!(cur.personA && cur.personB);
  cur[role] = !cur[role];
  cur[role + '_ts'] = Date.now();
  await sSet(key, cur, true);
  const nowBoth = !!(cur.personA && cur.personB);
  await render();
  if(!wasBoth && nowBoth) celebrate();
}
function ringBell(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.8);
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 1.2);
  }catch(e){ /* audio not available */ }
}
async function offerModak(){
  const key = 'ganpati-modaks';
  const cur = (await sGet(key, true)) || {personA:0, personB:0};
  const role = getMyRole();
  cur[role] = (cur[role] || 0) + 1;
  await sSet(key, cur, true);
  render();
}
async function beginVisarjan(){
  await sSet('ganpati-visarjan', {done:true, ts:Date.now()}, true);
  render();
}
async function resetAll(){
  if(!confirm("This clears this year's Bappa corner for both of you, so you can start fresh next year. Continue?")) return;
  await safeDelete('ganpati-setup', true);
  await safeDelete('ganpati-modaks', true);
  await safeDelete('ganpati-notes', true);
  await safeDelete('ganpati-visarjan', true);
  for(let i = 0; i < TOTAL_DAYS; i++){
    const d = new Date(START_DATE); d.setDate(d.getDate() + i);
    await safeDelete('ganpati-checkin-' + dateKeyFor(d), true);
  }
  await safeDelete('ganpati-whoami', false);
  SETUP = null; WHOAMI = null; TOTAL_DAYS = 0; TODAY_IDX = 0;
  render();
}

appEl.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  if(action === 'select-duration'){ updateDurationSelection(t); return; }
  if(action === 'choose-who'){ await chooseWho(t.dataset.name); return; }
  if(action === 'light-diya'){ await lightDiya(t.dataset.role); return; }
  if(action === 'ring-bell'){ ringBell(); return; }
  if(action === 'offer-modak'){ await offerModak(); return; }
  if(action === 'begin-visarjan'){ await beginVisarjan(); return; }
  if(action === 'reset-all'){ await resetAll(); return; }
});
appEl.addEventListener('submit', async (e) => {
  const form = e.target;
  if(form.dataset && form.dataset.form === 'setup'){ e.preventDefault(); await submitSetup(form); }
  else if(form.dataset && form.dataset.form === 'note'){ e.preventDefault(); await submitNote(form); }
});

async function init(){
  const setupRes = await sGet('ganpati-setup', true);
  SETUP = setupRes;
  if(SETUP){
    const whoRes = await sGet('ganpati-whoami', false);
    WHOAMI = whoRes ? whoRes.name : null;
    TOTAL_DAYS = Math.ceil(currentDuration().days);
    TODAY_IDX = dayIndexFor(new Date());
  }
  render();
}
init();
</script>
</body>
</html>
