<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Bappa, Saath Saath 🪔</title>

<meta
    name="description"
    content="A little Ganeshotsav corner for two hearts celebrating together."
>

<meta name="theme-color" content="#241016">

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

:root {
    --bg: #170b0f;
    --bg2: #241016;
    --card: rgba(55, 22, 29, .78);
    --gold: #e7b75f;
    --gold2: #ffd98b;
    --cream: #fff4dc;
    --muted: #c9aeb0;
    --red: #9d3848;
    --green: #6fa66e;
    --danger: #df6670;
    --shadow: 0 20px 60px rgba(0,0,0,.35);
    --radius: 24px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(183,104,43,.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(128,36,52,.15),
            transparent 30%
        ),
        var(--bg);

    color: var(--cream);

    font-family:
        "DM Sans",
        sans-serif;

    overflow-x: hidden;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: default;
}

.hidden {
    display: none !important;
}


/* =========================================================
   BACKGROUND
========================================================= */

.bg-glow {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: -2;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(231,183,95,.06),
            transparent 20%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(157,56,72,.08),
            transparent 25%
        );
}

#particles {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: -1;

    overflow: hidden;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: var(--gold);

    opacity: .35;

    animation:
        floatParticle linear infinite;
}

@keyframes floatParticle {

    from {
        transform: translateY(110vh);
    }

    to {
        transform: translateY(-10vh);
    }

}


/* =========================================================
   COMMON
========================================================= */

#app {
    width: 100%;
    min-height: 100vh;
}

.screen {
    width: 100%;
    min-height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 24px;
}

h1,
h2,
h3 {
    font-family:
        "Cormorant Garamond",
        serif;
}


/* =========================================================
   SETUP
========================================================= */

.setup-card {

    width: min(560px, 100%);

    padding: 38px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(65,27,34,.94),
            rgba(31,13,18,.96)
        );

    border:
        1px solid
        rgba(231,183,95,.20);

    border-radius: 32px;

    box-shadow: var(--shadow);

    backdrop-filter: blur(20px);
}

.logo {

    width: 76px;
    height: 76px;

    margin: 0 auto 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(231,183,95,.09);

    border:
        1px solid
        rgba(231,183,95,.25);

    font-size: 38px;
}

.setup-card h1 {

    color: var(--gold2);

    font-size:
        clamp(38px, 8vw, 60px);

    line-height: 1;

    margin-bottom: 12px;
}

.subtitle {

    color: var(--muted);

    line-height: 1.6;

    margin-bottom: 30px;
}

.form-group {

    text-align: left;

    margin-bottom: 18px;
}

.form-group label {

    display: block;

    color: var(--gold2);

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 1.5px;

    margin-bottom: 8px;
}

input {

    width: 100%;

    padding: 15px 16px;

    border:
        1px solid
        rgba(231,183,95,.2);

    border-radius: 14px;

    outline: none;

    background:
        rgba(0,0,0,.22);

    color: var(--cream);

    transition: .2s;
}

input:focus {

    border-color:
        var(--gold);

    box-shadow:
        0 0 0 3px
        rgba(231,183,95,.08);
}

input::placeholder {
    color: #866e72;
}


/* =========================================================
   DURATION
========================================================= */

.duration-grid {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 8px;

    margin-top: 8px;
}

.duration-btn {

    padding: 12px 5px;

    border:
        1px solid
        rgba(231,183,95,.18);

    border-radius: 12px;

    color: var(--muted);

    background:
        rgba(0,0,0,.16);

    transition: .2s;
}

.duration-btn:hover,
.duration-btn.active {

    color: #20100d;

    background: var(--gold);

    border-color: var(--gold);
}


/* =========================================================
   BUTTONS
========================================================= */

.primary-btn {

    width: 100%;

    padding: 16px;

    margin-top: 10px;

    border: 0;

    border-radius: 15px;

    color: #24130d;

    background:
        linear-gradient(
            135deg,
            var(--gold2),
            var(--gold)
        );

    font-weight: 700;

    box-shadow:
        0 10px 30px
        rgba(231,183,95,.12);

    transition: .2s;
}

.primary-btn:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 35px
        rgba(231,183,95,.20);
}

.firebase-info {

    margin-top: 18px;

    color: #816b6e;

    font-size: 11px;

    line-height: 1.6;
}


/* =========================================================
   ROLE
========================================================= */

.role-card {

    width: min(600px, 100%);

    text-align: center;
}

.role-card h1 {

    color: var(--gold2);

    font-size:
        clamp(42px, 9vw, 64px);

    margin-bottom: 8px;
}

.role-card p {

    color: var(--muted);

    margin-bottom: 30px;
}

.role-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 16px;
}

.role-btn {

    padding: 28px 15px;

    border:
        1px solid
        rgba(231,183,95,.2);

    border-radius: 25px;

    background: var(--card);

    color: var(--cream);

    box-shadow: var(--shadow);

    transition: .25s;
}

.role-btn:hover {

    transform:
        translateY(-4px);

    border-color:
        rgba(231,183,95,.5);
}

.role-icon {

    font-size: 45px;

    margin-bottom: 12px;
}

.role-name {

    color: var(--gold2);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 28px;
}

.role-small {

    color: var(--muted);

    font-size: 12px;

    margin-top: 5px;
}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard {

    width:
        min(1100px, 100%);

    margin: auto;

    padding:
        22px 0 50px;
}

.topbar {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}

.brand-icon {
    font-size: 30px;
}

.brand-title {

    color: var(--gold2);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 27px;
}

.brand-subtitle {

    color: var(--muted);

    font-size: 11px;
}

.sync-status {

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        8px 12px;

    border-radius: 50px;

    border:
        1px solid
        rgba(231,183,95,.12);

    background:
        rgba(0,0,0,.15);

    color: var(--muted);

    font-size: 11px;
}

.sync-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--gold);
}

.sync-dot.online {
    background: var(--green);
}

.sync-dot.error {
    background: var(--danger);
}


/* =========================================================
   HERO
========================================================= */

.hero {

    position: relative;

    overflow: hidden;

    padding:
        42px 25px 32px;

    margin-bottom: 20px;

    text-align: center;

    border-radius: 32px;

    border:
        1px solid
        rgba(231,183,95,.15);

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(231,183,95,.14),
            transparent 40%
        ),
        linear-gradient(
            145deg,
            rgba(81,30,38,.72),
            rgba(30,12,18,.88)
        );

    box-shadow: var(--shadow);
}

.hero::before,
.hero::after {

    content: "✦";

    position: absolute;

    color:
        rgba(231,183,95,.35);

    font-size: 25px;
}

.hero::before {

    left: 25px;
    top: 25px;
}

.hero::after {

    right: 25px;
    bottom: 25px;
}

.hero h1 {

    color: var(--gold2);

    font-size:
        clamp(43px, 8vw, 72px);

    line-height: .9;
}

.hero-date {

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 15px;
}

.days-left {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding:
        9px 16px;

    margin-top: 15px;

    border-radius: 50px;

    background:
        rgba(231,183,95,.08);

    border:
        1px solid
        rgba(231,183,95,.18);

    color: var(--gold2);

    font-size: 12px;
}


/* =========================================================
   ANIMATED GANESH JI
========================================================= */

.ganesh-wrap {

    width:
        min(300px, 75vw);

    aspect-ratio: 1;

    position: relative;

    margin:
        25px auto 10px;

    display: flex;

    align-items: center;
    justify-content: center;

    animation:
        ganeshFloat 4s ease-in-out infinite;
}


/* Golden aura */

.ganesh-aura {

    position: absolute;

    width: 82%;
    height: 82%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,213,125,.38) 0%,
            rgba(231,183,95,.18) 35%,
            transparent 72%
        );

    filter: blur(12px);

    animation:
        auraPulse 3s ease-in-out infinite;
}


/* SVG container */

.ganesh {

    position: absolute;

    inset: 5%;

    display: flex;

    align-items: center;
    justify-content: center;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(231,183,95,.25)
        );
}

.ganesh-svg {

    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================================================
   GANESH SVG COLORS
========================================================= */

.g-crown,
.g-jewel,
.g-face,
.g-ear,
.g-body,
.g-belly,
.g-arm,
.g-foot,
.g-trunk,
.g-modak {

    transform-box:
        fill-box;

    transform-origin:
        center;
}


/* Crown */

.g-crown {

    fill: #d79a32;

    stroke: #ffe2a0;

    stroke-width: 3;

    animation:
        crownGlow 2.5s ease-in-out infinite;
}


/* Crown jewel */

.g-jewel {

    fill: #ffdf7e;

    animation:
        jewelPulse 1.8s ease-in-out infinite;
}


/* Face */

.g-face,
.g-ear {

    fill: #d87942;

    stroke: #ffd08a;

    stroke-width: 3;
}


/* Body */

.g-body {

    fill: #c9693d;

    stroke: #ffd08a;

    stroke-width: 3;
}


/* Belly */

.g-belly {

    fill: #df8a4e;

    stroke: #ffd08a;

    stroke-width: 2;
}


/* Eyes */

.g-eye {

    fill: #241016;

    transform-box:
        fill-box;

    transform-origin:
        center;

    animation:
        eyeBlink 5s infinite;
}


/* Tilak */

.g-tilak {

    fill: #8d2639;
}


/* Trunk */

.g-trunk {

    fill: none;

    stroke: #d87942;

    stroke-width: 24;

    stroke-linecap: round;

    transform-box:
        fill-box;

    transform-origin:
        center;

    animation:
        trunkMove 4s ease-in-out infinite;
}

.g-trunk-tip {

    fill: none;

    stroke: #d87942;

    stroke-width: 12;

    stroke-linecap: round;
}


/* Arms */

.g-arm {

    fill: none;

    stroke: #d87942;

    stroke-width: 15;

    stroke-linecap: round;
}


/* Modak */

.g-modak {

    fill: #e7b75f;

    stroke: #ffe3a5;

    stroke-width: 2;

    animation:
        modakGlow 2s ease-in-out infinite;
}

.g-modak-lines {

    fill: none;

    stroke: #9a552d;

    stroke-width: 2;
}


/* Feet */

.g-foot {

    fill: #c9693d;

    stroke: #ffd08a;

    stroke-width: 2;
}


/* =========================================================
   GANESH ANIMATIONS
========================================================= */

@keyframes ganeshFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-9px);
    }
}

@keyframes auraPulse {

    0%,
    100% {

        transform:
            scale(.92);

        opacity: .65;
    }

    50% {

        transform:
            scale(1.08);

        opacity: 1;
    }
}

@keyframes crownGlow {

    0%,
    100% {

        filter:
            drop-shadow(
                0 0 3px
                rgba(255,215,120,.2)
            );
    }

    50% {

        filter:
            drop-shadow(
                0 0 14px
                rgba(255,215,120,.75)
            );
    }
}

@keyframes jewelPulse {

    0%,
    100% {

        transform:
            scale(.85);

        opacity: .75;
    }

    50% {

        transform:
            scale(1.25);

        opacity: 1;
    }
}

@keyframes modakGlow {

    0%,
    100% {

        filter:
            drop-shadow(
                0 0 2px
                rgba(255,215,120,.2)
            );
    }

    50% {

        filter:
            drop-shadow(
                0 0 12px
                rgba(255,215,120,.7)
            );
    }
}

@keyframes trunkMove {

    0%,
    100% {

        transform:
            rotate(0deg);
    }

    50% {

        transform:
            rotate(-2deg);
    }
}

@keyframes eyeBlink {

    0%,
    46%,
    49%,
    100% {

        transform:
            scaleY(1);
    }

    47%,
    48% {

        transform:
            scaleY(.08);
    }
}


/* =========================================================
   GANESH SPARKLES
========================================================= */

.ganesh-sparkle {

    position: absolute;

    color:
        var(--gold2);

    font-size: 20px;

    text-shadow:
        0 0 10px
        rgba(255,215,120,.8);

    animation:
        sparkleFloat 2.5s ease-in-out infinite;
}

.sparkle-1 {

    top: 16%;
    left: 10%;

    animation-delay:
        0s;
}

.sparkle-2 {

    top: 28%;
    right: 8%;

    animation-delay:
        .8s;
}

.sparkle-3 {

    bottom: 18%;
    left: 17%;

    animation-delay:
        1.5s;
}

@keyframes sparkleFloat {

    0%,
    100% {

        transform:
            scale(.5)
            rotate(0deg);

        opacity: .2;
    }

    50% {

        transform:
            scale(1.25)
            rotate(180deg);

        opacity: 1;
    }
}


/* =========================================================
   CONTENT
========================================================= */

.content-grid {

    display: grid;

    grid-template-columns:
        1.2fr .8fr;

    gap: 18px;
}

.card {

    padding: 22px;

    border-radius:
        var(--radius);

    border:
        1px solid
        rgba(231,183,95,.13);

    background:
        var(--card);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(12px);
}

.card-title {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    margin-bottom: 16px;

    color: var(--gold2);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 26px;
}

.card-title small {

    color: var(--muted);

    font-family:
        "DM Sans",
        sans-serif;

    font-size: 10px;

    font-weight: 400;
}


/* =========================================================
   DIYAS
========================================================= */

.diya-area {

    display: flex;

    align-items:
        flex-end;

    justify-content:
        space-around;

    padding:
        18px 10px 10px;
}

.diya {

    text-align: center;
}

.diya-flame {

    display: block;

    font-size: 34px;

    animation:
        flicker 1.2s
        infinite alternate;
}

.diya-name {

    color:
        var(--muted);

    font-size: 11px;

    margin-top: 6px;
}

@keyframes flicker {

    from {

        transform:
            scale(.95)
            rotate(-2deg);

        opacity: .85;
    }

    to {

        transform:
            scale(1.08)
            rotate(2deg);

        opacity: 1;
    }
}


/* =========================================================
   ACTIONS
========================================================= */

.action-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.action-btn {

    min-height: 100px;

    padding: 15px;

    border:
        1px solid
        rgba(231,183,95,.13);

    border-radius: 17px;

    background:
        rgba(0,0,0,.16);

    color:
        var(--cream);

    transition: .2s;
}

.action-btn:hover {

    transform:
        translateY(-2px);

    border-color:
        rgba(231,183,95,.35);
}

.action-icon {

    display: block;

    font-size: 30px;

    margin-bottom: 8px;
}

.action-label {

    color:
        var(--gold2);

    font-size: 12px;

    font-weight: 600;
}

.action-value {

    color:
        var(--muted);

    font-size: 10px;

    margin-top: 3px;
}


/* =========================================================
   MODAK
========================================================= */

.modak-count {

    text-align: center;

    padding:
        15px 0 20px;
}

.modak-number {

    color:
        var(--gold2);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 70px;

    line-height: 1;
}

.modak-label {

    color:
        var(--muted);

    font-size: 12px;
}

.modak-btn {

    display: block;

    margin: auto;

    padding:
        11px 20px;

    border:
        1px solid
        rgba(231,183,95,.3);

    border-radius: 50px;

    background:
        rgba(231,183,95,.08);

    color:
        var(--gold2);

    transition: .2s;
}

.modak-btn:hover {

    background:
        rgba(231,183,95,.16);
}


/* =========================================================
   NOTES
========================================================= */

.note-input {

    display: flex;

    gap: 8px;
}

.note-input input {
    min-width: 0;
}

.note-send {

    width: 48px;

    border: 0;

    border-radius: 14px;

    background:
        var(--gold);

    color: #25120d;

    font-weight: 700;
}

.notes {

    display: flex;

    flex-direction: column;

    gap: 9px;

    max-height: 250px;

    overflow-y: auto;

    margin-top: 15px;
}

.note {

    padding: 12px;

    border-radius: 13px;

    border-left:
        2px solid
        var(--gold);

    background:
        rgba(0,0,0,.16);
}

.note-author {

    color:
        var(--gold);

    font-size: 10px;

    margin-bottom: 3px;
}

.note-text {

    color:
        var(--cream);

    font-size: 12px;

    line-height: 1.5;
}


/* =========================================================
   STATS
========================================================= */

.stats-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}

.stat {

    padding:
        16px 8px;

    text-align: center;

    border-radius: 15px;

    background:
        rgba(0,0,0,.14);
}

.stat-number {

    color:
        var(--gold2);

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 32px;
}

.stat-label {

    color:
        var(--muted);

    font-size: 9px;
}


/* =========================================================
   SHARE
========================================================= */

.share-box {

    text-align: center;
}

.share-box p {

    color:
        var(--muted);

    font-size: 12px;

    line-height: 1.6;

    margin-bottom: 14px;
}

.share-btn {

    width: 100%;

    padding: 13px;

    border:
        1px solid
        rgba(231,183,95,.25);

    border-radius: 14px;

    background:
        rgba(231,183,95,.08);

    color:
        var(--gold2);

    font-weight: 600;
}

.room-code {

    color: #806a6d;

    font-size: 10px;

    margin-top: 12px;

    word-break: break-all;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    color: #6d575b;

    text-align: center;

    font-size: 11px;

    padding:
        28px 0 5px;
}

.footer span {
    color: var(--gold);
}


/* =========================================================
   TOAST
========================================================= */

#toast {

    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 100;

    max-width:
        calc(100vw - 30px);

    padding:
        12px 18px;

    border-radius: 50px;

    background:
        #fff1d2;

    color:
        #301710;

    font-size: 12px;

    font-weight: 600;

    text-align: center;

    box-shadow:
        0 10px 35px

async function authenticate() {

function getToday() {

function createRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code =
        "BAPPA-";

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];
    }

    return code;
}


function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}

function loadLocal() {

function updateSyncStatus(

) {

    const status =
        document.getElementById(

    const dot =
        document.getElementById(
            "syncDot"
        );

    const label =
        document.getElementById(
            "syncText"
        );

    if (
        !status ||
        !dot ||
        !label
    ) {

        return;
    }

    dot.className =
        "sync-dot";

    if (
        type === "online"
    ) {

        dot.classList.add(
            "online"
        );
    }

    if (
        type === "error"
    ) {

        dot.classList.add(
            "error"
        );
    }

    label.textContent =
        text;
}


/* =========================================================
   TOAST
========================================================= */

function toast(message) {

    const element =
        document.getElementById(
            "toast"
        );

    if (!element) {
        return;
    }

    element.textContent =
        message;

    element.classList.add(
        "show"
    );

    clearTimeout(
        toast.timer
    );

    toast.timer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2600
        );
}

/* =========================================================
   FIREBASE ERROR
========================================================= */

function firebaseErrorMessage(error) {

    const code =
        error?.code || "";


    if (
        code ===
        "auth/operation-not-allowed"
    ) {

        return:
        "Enable Anonymous Authentication in Firebase.";
    }


    if (
        code ===
        "auth/unauthorized-domain"
    ) {

        return:
        "Add this website domain in Firebase Authorized Domains.";
    }


    if (
        code ===
        "permission-denied"
    ) {

        return:
        "Firestore rules are blocking access.";
    }


    if (
        code ===
        "failed-precondition"
    ) {

        return:
        "Please create your Firestore database.";
    }


    return:
    "Firebase connection failed.";
}


/* =========================================================
   ROOM LISTENER
========================================================= */

async function startRoomListener() {

    if (!state?.roomCode) {
        return;
    }


    try {

        await authenticate();


        if (unsubscribeRoom) {

            unsubscribeRoom();

            unsubscribeRoom =
                null;
        }


        const reference =
            roomRef();


        unsubscribeRoom =
            onSnapshot(

                reference,

                snapshot => {

                    if (
                        !snapshot.exists()
                    ) {

                        updateSyncStatus(
                            "error",
                            "Room missing"
                        );

                        return;
                    }


                    const remoteData =
                        snapshot.data();


                    state = {
                        ...state,
                        ...remoteData
                    };


                    saveLocal();


                    updateSyncStatus(
                        "online",
                        "Synced"
                    );


                    renderCurrentScreen();

                },


                error => {

                    console.error(
                        "Realtime listener:",
                        error
                    );


                    updateSyncStatus(
                        "error",
                        "Sync error"
                    );
                }
            );

    } catch (error) {

        console.error(
            "Listener error:",
            error
        );


        updateSyncStatus(
            "error",
            "Connection error"
        );
    }
}


/* =========================================================
   LOAD ROOM
========================================================= */

async function loadRoom(
    roomCode
) {

    try {

        await authenticate();


        updateSyncStatus(
            "normal",
            "Loading room..."
        );


        const reference =
            doc(
                db,
                "bappaRooms",
                roomCode
            );


        const snapshot =
            await getDoc(
                reference
            );


        if (
            !snapshot.exists()
        ) {

            throw new Error(
                "ROOM_NOT_FOUND"
            );
        }


        state =
            snapshot.data();


        saveLocal();


        await startRoomListener();


        return true;

    } catch (error) {

        console.error(
            "Load room error:",
            error
        );


        updateSyncStatus(
            "error",
            "Room unavailable"
        );


        return false;
    }
}

function setRoomURL(

    const url =

    url.searchParams.set(

}

   SHARE

async function shareRoom() {

    if (!state?.roomCode) {
        return;
    }


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "room",
        state.roomCode

    const shareURL =
        url.toString();


    try {

        if (
            navigator.share
        ) {

            await navigator.share({

                title:
                    "Bappa, Saath Saath 🪔",

                text:
                    "Come celebrate Ganeshotsav with me ❤️",

                url:
                    shareURL
            });

        } else {

            await copyText(
                shareURL
            );

            toast(
                "Room link copied ❤️"
            );
        }

    } catch (error) {

        try {

            await copyText(
                shareURL
            );

            toast(
                "Room link copied ❤️"
            );

        } catch {

            prompt(
                "Copy this room link:",
                shareURL
            );
        }
    }
}


async function copyText(text) {

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        await navigator.clipboard.writeText(
            text
        );

        return;
    }


    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    textarea.style.position =
        "fixed";


    textarea.style.left =
        "-9999px";


    document.body.appendChild(
        textarea
    );


    textarea.select();


    document.execCommand(
        "copy"
    );


    textarea.remove();
}

/* =========================================================
   CHECK IN
========================================================= */

window.checkIn =
async function() {

    if (!state) {
        return;
    }


    const role =
        getRole() || "A";


    if (
        state.checkins?.[role]
    ) {

        return;
    }


    try {

        await authenticate();


        updateSyncStatus(
            "normal",
            "Saving..."
        );


        const update = {};


        update[
            `checkins.${role}`
        ] = true;


        update.updatedAt =
            Date.now();


        await updateDoc(
            roomRef(),
            update
        );


        state.checkins = {

            ...(state.checkins || {}),

            [role]:
                true
        };


        saveLocal();


        toast(
            "Your diya is glowing 🪔❤️"
        );


    } catch (error) {

        console.error(
            error
        );


        toast(
            firebaseErrorMessage(
                error
            )
        );
    }
};

/* =========================================================
   NOTES
========================================================= */

window.sendNote =
async function() {

    const input =
        document.getElementById(
            "noteInput"
        );


    if (!input) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        toast(
            "Write something first ❤️"
        );

        return;
    }


    const role =
        getRole() || "A";


    const author =
        role === "A"
        ?
        state.nameA
        :
        state.nameB;


    const note = {

        author:
            author,

        text:
            text,

        role:
            role,

        createdAt:
            Date.now()
    };


    try {

        await authenticate();


        await updateDoc(
            roomRef(),
            {

                notes:
                    arrayUnion(note),

                updatedAt:
                    Date.now()

            }
        );


        state.notes = [

            ...(state.notes || []),

            note

        ];


        saveLocal();


        input.value =
            "";


        toast(
            "Your little note was sent 💌"
        );


    } catch (error) {

        console.error(
            error
        );


        toast(
            firebaseErrorMessage(
                error
            )
        );
    }
};


/* =========================================================
   BELL AUDIO
========================================================= */

function playBell() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.setValueAtTime(
            620,
            context.currentTime
        );


        oscillator.frequency.exponentialRampToValueAtTime(
            320,
            context.currentTime + 1.2
        );


        gain.gain.setValueAtTime(
            0.0001,
            context.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.18,
            context.currentTime + 0.02
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            context.currentTime + 1.2
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        oscillator.stop(
            context.currentTime + 1.2
        );

    } catch (error) {

        console.warn(
            "Audio unavailable:",
            error
        );
    }
}

/* =========================================================
   PARTICLES
========================================================= */

function createParticles() {

    const container =
        document.getElementById(
            "particles"
        );


    if (!container) {
        return;
    }


    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.style.left =
            Math.random() * 100 +
            "%";


        particle.style.animationDuration =
            (
                10 +
                Math.random() * 20
            ) +
            "s";


        particle.style.animationDelay =
            (
                -Math.random() * 20
            ) +
            "s";


        container.appendChild(
            particle
        );
    }
}


/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize() {

    createParticles();


    try {

        await authenticate();

    } catch (error) {

        console.error(
            "Firebase authentication failed:",
            error
        );
    }


    const roomCode =
        getRoomFromURL();


    /* =====================================================
       SHARED ROOM
    ===================================================== */

    if (roomCode) {

        const loaded =
            await loadRoom(
                roomCode
            );


        if (loaded) {

            /*
             * IMPORTANT:
             *
             * Each phone chooses its own role.
             */

            renderCurrentScreen();

            return;
        }


        app.innerHTML = `

            <section class="screen">

                <div class="setup-card">

                    <div class="logo">
                        🪔
                    </div>


                    <h1>
                        Room not found
                    </h1>

                        celebration room.

                        <br><br>

                        <strong
                            style="

                                word-break:break-all;
                            "
                        >

                            ${escapeHTML(
                                roomCode
                            )}

                        </strong>

                        <br><br>

                        Check the shared link
                        and try again.

                    </p>


                    <button
                        class="primary-btn"
                        onclick="startNewRoom()"
                    >

                        Create New Celebration

                    </button>

                </div>

            </section>
        `;


        return;
    }


    /* =====================================================
       LOCAL ROOM
    ===================================================== */

    const cached =
        loadLocal();


    if (cached?.roomCode) {

        state =
            cached;


        renderCurrentScreen();


        try {

            await startRoomListener();

        } catch (error) {

            console.warn(
                error
            );
        }


        return;
    }


    /* =====================================================
       NEW USER
    ===================================================== */

    renderSetup();
}

========================================================= */

window.startNewRoom =
function() {

    state =
        null;


    localStorage.removeItem(
        STORAGE_KEY
    );


    localStorage.removeItem(
        ROLE_KEY
    );


    if (unsubscribeRoom) {

        unsubscribeRoom();

        unsubscribeRoom =
            null;
    }


    clearRoomURL();


    renderSetup();
};
