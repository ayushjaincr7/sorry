<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You, Dhari ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   COLORS
========================================================= */

:root{

  --sky-top:#0d061d;
  --sky-mid:#29123f;
  --sky-low:#a84f78;
  --sky-floor:#f5b18d;

  --moon:#fff5df;
  --moon-glow:#ffdca0;

  --star:#fff9ef;
  --firefly:#ffd477;

  --hill-back:#32183f;
  --hill-front:#160a26;

  --cream:#fff3e8;
  --blush:#ffc6d9;

  --leaf:#527c69;

  --rose:#e95f82;
  --rose-light:#ff9fba;

  --tulip:#ff8fa8;
  --tulip-light:#ffc0d0;

  --cherry:#ffb6ce;
  --cherry-light:#ffe0eb;

  --hibiscus:#ed668d;
  --hibiscus-light:#ff9db9;

  --daisy:#fff4d0;
  --daisy-center:#f4b94f;

  --peony:#f48aaa;
  --peony-light:#ffc2d6;
}


/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  font-family:
    'Cormorant Garamond',
    serif;

  color:var(--cream);

  background:
    var(--sky-top);
}


/* =========================================================
   MAIN SCENE
========================================================= */

.scene{

  position:relative;

  width:100vw;
  height:100vh;

  overflow:hidden;

  background:

    radial-gradient(
      circle at 70% 20%,
      rgba(255,220,180,.10),
      transparent 20%
    ),

    linear-gradient(
      180deg,
      var(--sky-top) 0%,
      var(--sky-mid) 46%,
      var(--sky-low) 81%,
      var(--sky-floor) 100%
    );
}


.scene::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:8;

  background:

    radial-gradient(
      circle at 50% 70%,
      rgba(255,174,190,.10),
      transparent 35%
    );

  mix-blend-mode:screen;
}


/* =========================================================
   STARS
========================================================= */

.stars{

  position:absolute;

  inset:0;

  z-index:1;
}


.star{

  position:absolute;

  width:var(--s,2px);
  height:var(--s,2px);

  border-radius:50%;

  background:var(--star);

  opacity:.45;

  animation:

    twinkle
    var(--dur,3s)
    ease-in-out
    var(--del,0s)
    infinite alternate;
}


.star.special{

  box-shadow:
    0 0 6px 2px
    rgba(255,245,220,.55);
}


@keyframes twinkle{

  0%{
    opacity:.12;
    transform:scale(.7);
  }

  100%{
    opacity:.95;
    transform:scale(1.3);
  }

}


/* =========================================================
   MOON
========================================================= */

.moon{

  position:absolute;

  top:8%;
  right:12%;

  width:clamp(70px,9vw,105px);
  height:clamp(70px,9vw,105px);

  border-radius:50%;

  border:none;

  background:

    radial-gradient(
      circle at 32% 28%,
      #fffdf5,
      var(--moon) 55%,
      var(--moon-glow) 100%
    );

  box-shadow:

    0 0 35px 8px
    rgba(255,220,160,.28),

    0 0 85px 25px
    rgba(255,220,160,.12);

  cursor:pointer;

  z-index:5;

  transition:
    transform .4s ease,
    box-shadow .7s ease;
}


.moon:hover{

  transform:scale(1.07);
}


.moon:focus-visible{

  outline:
    2px solid
    var(--moon-glow);

  outline-offset:5px;
}


.moon::after{

  content:"";

  position:absolute;

  inset:-18px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,230,180,.08);
}


.moon.is-ready{

  animation:
    moon-pulse
    2.5s
    ease-in-out
    infinite;
}


.moon.is-shake{

  animation:
    moon-shake
    .5s
    ease;
}


@keyframes moon-pulse{

  0%,100%{

    box-shadow:

      0 0 35px 8px
      rgba(255,220,160,.28),

      0 0 85px 25px
      rgba(255,220,160,.12);
  }

  50%{

    box-shadow:

      0 0 55px 18px
      rgba(255,220,160,.48),

      0 0 115px 42px
      rgba(255,220,160,.20);
  }

}


@keyframes moon-shake{

  0%,100%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-6px);
  }

  75%{
    transform:translateX(6px);
  }

}


/* =========================================================
   MOON LABEL
========================================================= */

.moon-label{

  position:absolute;

  top:calc(8% + 115px);

  right:calc(12% - 15px);

  font-family:'Caveat',cursive;

  font-size:1rem;

  color:
    rgba(255,230,205,.65);

  opacity:0;

  transition:
    opacity .5s ease;

  z-index:5;

  pointer-events:none;
}


.moon.is-ready + .moon-label{

  opacity:1;
}


/* =========================================================
   FIREFLIES
========================================================= */

.fireflies{

  position:absolute;

  inset:0;

  z-index:3;

  pointer-events:none;
}


.firefly{

  position:absolute;

  left:50%;
  top:42%;

  width:5px;
  height:5px;

  margin:-2.5px;

  border-radius:50%;

  background:
    var(--firefly);

  box-shadow:
    0 0 9px 3px
    rgba(255,212,119,.5);

  opacity:.8;

  animation:

    wander
    var(--dur,7s)
    ease-in-out
    var(--del,0s)
    infinite;
}


.firefly.is-heart{

  width:6px;
  height:6px;

  box-shadow:

    0 0 14px 5px
    rgba(255,212,119,.8);

  opacity:1;
}


@keyframes wander{

  0%{
    transform:translate(0,0);
  }

  50%{

    transform:
      translate(
        var(--ax,60px),
        var(--ay,-40px)
      );
  }

  100%{

    transform:
      translate(
        calc(var(--ax,60px) * -.6),
        calc(var(--ay,-40px) * -.5)
      );
  }

}


/* =========================================================
   HILLS
========================================================= */

.hills{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  height:
    clamp(
      200px,
      30vh,
      320px
    );

  z-index:4;
}


/* =========================================================
   INTRO
========================================================= */

.intro{

  position:absolute;

  top:10%;
  left:7%;

  z-index:6;

  max-width:440px;

  animation:

    introAppear
    1.8s
    cubic-bezier(.2,.8,.2,1)
    both;
}


@keyframes introAppear{

  from{

    opacity:0;

    transform:
      translateY(20px);
  }

  to{

    opacity:1;

    transform:
      translateY(0);
  }

}


.intro .eyebrow{

  font-family:'Caveat',cursive;

  color:
    var(--blush);

  font-size:
    clamp(
      1.05rem,
      2vw,
      1.3rem
    );

  margin-bottom:.3rem;

  opacity:.75;
}


.intro h1{

  margin:0;

  font-weight:400;

  font-style:italic;

  line-height:1.1;

  font-size:
    clamp(
      2rem,
      5vw,
      3.7rem
    );

  letter-spacing:.01em;

  text-shadow:
    0 4px 25px
    rgba(0,0,0,.2);
}


.intro p{

  margin:
    .8rem 0 0;

  font-style:italic;

  font-size:
    clamp(
      1.05rem,
      2vw,
      1.35rem
    );

  line-height:1.5;

  opacity:.82;
}


.hint{

  font-family:'Caveat',cursive;

  color:
    var(--blush);

  font-size:
    clamp(
      1.05rem,
      1.8vw,
      1.25rem
    );

  opacity:.9;

  transition:
    opacity .4s ease,
    transform .4s ease;
}


.hint.changed{

  animation:
    hintChange
    .5s ease;
}


@keyframes hintChange{

  50%{

    opacity:.2;

    transform:
      translateY(-4px);
  }

}


/* =========================================================
   FLOWERBED
========================================================= */

.flowerbed{

  position:absolute;

  inset:0;

  z-index:7;

  pointer-events:none;
}


.flower{

  position:absolute;

  bottom:6%;

  width:48px;
  height:95px;

  padding:0;

  border:none;

  background:none;

  cursor:pointer;

  pointer-events:auto;

  transform:
    translateX(-50%);

  -webkit-tap-highlight-color:
    transparent;
}


.flower:focus{
  outline:none;
}


.flower svg{

  position:absolute;

  left:50%;
  top:0;

  width:76px;
  height:95px;

  transform:
    translateX(-50%)
    scale(.12);

  transform-origin:
    50% 100%;

  transition:

    transform
    .75s
    cubic-bezier(.34,1.56,.64,1);
}


.flower.is-bloomed svg{

  transform:
    translateX(-50%)
    scale(1);
}


/* flower glow */

.flower::after{

  content:"";

  position:absolute;

  left:50%;
  top:5px;

  width:50px;
  height:50px;

  transform:
    translateX(-50%);

  border-radius:50%;

  background:
    rgba(255,170,200,.10);

  filter:blur(10px);

  opacity:0;

  transition:
    opacity .5s ease;
}


.flower.is-bloomed::after{
  opacity:1;
}


/* =========================================================
   FLOWER LABEL
========================================================= */

.flower-name{

  position:absolute;

  bottom:-18px;

  left:50%;

  transform:
    translateX(-50%);

  white-space:nowrap;

  font-family:
    'Caveat',
    cursive;

  font-size:.85rem;

  color:
    rgba(255,235,220,.55);

  opacity:0;

  transition:
    opacity .5s ease;
}


.flower:hover .flower-name{

  opacity:.8;
}


/* =========================================================
   FLOATING WORD
========================================================= */

.word-layer{

  position:absolute;

  inset:0;

  z-index:9;

  pointer-events:none;
}


.bloom-word{

  position:absolute;

  bottom:23%;

  font-family:
    'Caveat',
    cursive;

  font-size:
    clamp(
      1.45rem,
      2.8vw,
      2rem
    );

  color:
    var(--cream);

  text-shadow:
    0 0 12px
    rgba(255,190,210,.45);

  transform:
    translate(-50%,0);

  animation:
    float-word
    2.6s
    ease-out
    forwards;
}


@keyframes float-word{

  0%{

    opacity:0;

    transform:
      translate(-50%,10px)
      scale(.75);
  }

  15%{

    opacity:1;

    transform:
      translate(-50%,-8px)
      scale(1);
  }

  100%{

    opacity:0;

    transform:
      translate(-50%,-80px)
      scale(1.08);
  }

}


/* =========================================================
   BUNNY COUPLE
========================================================= */

.couple{

  position:absolute;

  bottom:5%;
  left:50%;

  transform:
    translateX(-50%);

  display:flex;

  align-items:flex-end;

  z-index:8;

  filter:
    drop-shadow(
      0 8px 15px
      rgba(0,0,0,.18)
    );
}


.bunny{

  width:
    clamp(
      70px,
      9vw,
      100px
    );

  height:auto;

  animation:
    bob
    3.6s
    ease-in-out
    infinite;
}


.bunny.b2{

  animation:
    bob-flip
    3.6s
    ease-in-out
    .6s
    infinite;

  margin-left:-10px;
}


@keyframes bob{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-5px);
  }

}


@keyframes bob-flip{

  0%,100%{

    transform:
      scaleX(-1)
      translateY(0);
  }

  50%{

    transform:
      scaleX(-1)
      translateY(-5px);
  }

}


/* =========================================================
   HEART BETWEEN BUNNIES
========================================================= */

.love-pulse{

  position:absolute;

  bottom:13%;
  left:50%;

  transform:
    translateX(-50%);

  z-index:9;

  width:17px;
  height:17px;

  opacity:0;

  animation:

    pulse-heart
    5s
    ease-in-out
    1.4s
    infinite;
}


.love-pulse svg{

  width:100%;
  height:100%;

  filter:
    drop-shadow(
      0 0 6px
      rgba(255,180,210,.6)
    );
}


@keyframes pulse-heart{

  0%{

    opacity:0;

    transform:
      translate(-50%,0)
      scale(.6);
  }

  12%{

    opacity:1;

    transform:
      translate(-50%,-5px)
      scale(1);
  }

  55%{

    opacity:.8;

    transform:
      translate(-50%,-25px)
      scale(1.05);
  }

  75%{

    opacity:0;

    transform:
      translate(-50%,-38px)
      scale(1.2);
  }

  100%{
    opacity:0;
  }

}


/* =========================================================
   FINALE
========================================================= */

.finale{

  position:fixed;

  inset:0;

  z-index:30;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:
    6vh 6vw;

  background:

    radial-gradient(
      circle at center,
      rgba(120,44,85,.3),
      rgba(10,4,20,.78)
    );

  backdrop-filter:
    blur(3px);

  opacity:0;

  pointer-events:none;

  transition:
    opacity 1s ease;
}


.finale.is-visible{

  opacity:1;

  pointer-events:auto;
}


.finale-card{

  position:relative;

  width:
    min(
      560px,
      92vw
    );

  text-align:center;

  background:

    linear-gradient(
      145deg,
      rgba(83,43,101,.68),
      rgba(37,16,53,.7)
    );

  border:
    1px solid
    rgba(255,228,168,.32);

  border-radius:24px;

  padding:
    clamp(2.3rem,6vw,4rem)
    clamp(1.8rem,6vw,4rem);

  backdrop-filter:
    blur(15px);

  box-shadow:

    0 35px 100px
    rgba(0,0,0,.55),

    inset 0 1px
    rgba(255,255,255,.07);

  transform:
    translateY(25px)
    scale(.94);

  transition:

    transform
    1s
    cubic-bezier(.2,.8,.2,1);
}


.finale.is-visible .finale-card{

  transform:
    translateY(0)
    scale(1);
}


.finale-card::before{

  content:"";

  position:absolute;

  top:-1px;

  left:15%;
  right:15%;

  height:1px;

  background:

    linear-gradient(
      90deg,
      transparent,
      rgba(255,220,170,.7),
      transparent
    );
}


.small-heart{

  font-size:1.4rem;

  color:
    var(--blush);

  margin-bottom:1.2rem;

  animation:
    gentleHeart
    2.2s
    ease-in-out
    infinite;
}


@keyframes gentleHeart{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.15);
  }

}


.final-message{

  font-style:italic;

  font-size:
    clamp(
      1.35rem,
      3vw,
      1.75rem
    );

  line-height:1.65;

  margin:
    0 0 1.5rem;

  color:
    var(--cream);
}


.final-submessage{

  font-size:
    clamp(
      1rem,
      2vw,
      1.15rem
    );

  line-height:1.6;

  opacity:.72;

  margin:
    0 auto 1.5rem;

  max-width:420px;
}


.signature-line{

  font-family:
    'Caveat',
    cursive;

  font-size:
    clamp(
      1.35rem,
      2.7vw,
      1.65rem
    );

  color:
    var(--blush);

  margin:
    0 0 2rem;
}


.replay-btn{

  background:transparent;

  border:
    1px solid
    rgba(255,220,160,.6);

  color:
    var(--moon-glow);

  padding:
    .6rem 1.6rem;

  border-radius:999px;

  font-family:
    'Cormorant Garamond',
    serif;

  font-style:italic;

  font-size:1rem;

  cursor:pointer;

  transition:
    background .3s ease,
    color .3s ease,
    transform .3s ease;
}


.replay-btn:hover{

  background:
    var(--moon-glow);

  color:
    var(--sky-top);

  transform:
    translateY(-2px);
}


.replay-btn:focus-visible{

  outline:
    2px solid
    var(--moon-glow);

  outline-offset:4px;
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti-layer{

  position:fixed;

  inset:0;

  z-index:25;

  pointer-events:none;
}


.confetti-piece{

  position:absolute;

  bottom:-5%;

  width:15px;
  height:15px;

  opacity:0;

  animation:
    rise
    3.5s
    ease-out
    forwards;
}


.confetti-piece svg{

  width:100%;
  height:100%;
}


@keyframes rise{

  0%{

    opacity:0;

    transform:
      translate(0,0)
      rotate(0deg)
      scale(.6);
  }

  12%{
    opacity:.9;
  }

  100%{

    opacity:0;

    transform:
      translate(
        var(--dx,20px),
        -100vh
      )
      rotate(var(--rot,180deg))
      scale(1);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:560px){

  .intro{

    top:8%;
    left:8%;

    max-width:290px;
  }


  .intro h1{
    font-size:2.25rem;
  }


  .intro p{
    font-size:1.05rem;
  }


  .moon{

    top:8%;
    right:8%;
  }


  .moon-label{

    top:
      calc(8% + 90px);

    right:7%;

    font-size:.9rem;
  }


  .flower{

    bottom:6%;
  }


  .flower svg{

    width:65px;
    height:90px;
  }


  .couple{
    bottom:4%;
  }


  .bunny{
    width:72px;
  }


  .finale-card{

    padding:
      2.2rem 1.5rem;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  .star,
  .firefly,
  .bunny,
  .love-pulse,
  .moon,
  .small-heart{

    animation:none !important;
  }


  .flower svg,
  .finale-card,
  .finale,
  .moon{

    transition-duration:
      .01ms !important;
  }


  .bloom-word,
  .confetti-piece{

    animation-duration:
      .01ms !important;
  }

}

</style>
</head>


<body>


<div class="scene">


  <!-- =====================================================
       STARS
  ====================================================== -->

  <div
    class="stars"
    id="stars">
  </div>


  <!-- =====================================================
       MOON
  ====================================================== -->

  <button
    class="moon"
    id="moon"
    aria-label="make a wish">
  </button>

  <div class="moon-label">
    make a wish...
  </div>


  <!-- =====================================================
       FIREFLIES
  ====================================================== -->

  <div
    class="fireflies"
    id="fireflies">
  </div>


  <!-- =====================================================
       HILLS
  ====================================================== -->

  <svg
    class="hills"
    viewBox="0 0 1200 300"
    preserveAspectRatio="none">

    <path
      d="
        M0,180
        C200,120 400,200 600,150
        C800,100 1000,190 1200,140
        L1200,300
        L0,300
        Z
      "
      fill="var(--hill-back)"
    />

    <path
      d="
        M0,220
        C220,160 380,240 620,190
        C860,140 1040,230 1200,180
        L1200,300
        L0,300
        Z
      "
      fill="var(--hill-front)"
    />

  </svg>


  <!-- =====================================================
       INTRO
  ====================================================== -->

  <div class="intro">

    <div class="eyebrow">
      a little something, only for you
    </div>

    <h1 id="introTitle">
      For the one who feels like home.
    </h1>

    <p id="introLine">
      I wanted to make you a little garden...
      because some feelings are better grown slowly.
    </p>

    <p
      class="hint"
      id="hint"
      aria-live="polite">

      tap the flowers and let them bloom

    </p>

  </div>


  <!-- =====================================================
       FLOWERS
  ====================================================== -->

  <div
    class="flowerbed"
    id="flowerbed">
  </div>


  <!-- FLOATING WORDS -->

  <div
    class="word-layer"
    id="wordLayer">
  </div>


  <!-- =====================================================
       BUNNY COUPLE
  ====================================================== -->

  <div class="couple">


    <!-- Bunny 1 -->

    <svg
      class="bunny b1"
      viewBox="0 0 100 90">

      <ellipse
        cx="34"
        cy="18"
        rx="9"
        ry="24"
        fill="#d9c9f1"
        transform="rotate(-12 34 18)"
      />

      <ellipse
        cx="58"
        cy="18"
        rx="9"
        ry="24"
        fill="#d9c9f1"
        transform="rotate(10 58 18)"
      />

      <ellipse
        cx="34"
        cy="21"
        rx="4"
        ry="15"
        fill="#ffc4d6"
        transform="rotate(-12 34 21)"
      />

      <ellipse
        cx="58"
        cy="21"
        rx="4"
        ry="15"
        fill="#ffc4d6"

  7,

const flowerbed =
  document.getElementById(
    "flowerbed"

const wordLayer =
  document.getElementById(

  );


const hint =
  document.getElementById(
    "hint"
  );


const moon =
  document.getElementById(
    "moon"
  );


let bloomCount = 0;


/* ============================================================
   CREATE SIX DIFFERENT FLOWERS
============================================================ */

positions.forEach(
  (left,index) => {

    const flower =
      document.createElement(
        "button"
      );


    flower.className =
      "flower";


    flower.style.left =
      left + "%";


    flower.setAttribute(
      "aria-label",
      `Bloom the ${CONFIG.flowers[index].name}`
    );


    flower.innerHTML =

      flowerDesigns[index]() +

      `

      <span class="flower-name">

        ${CONFIG.flowers[index].name}

      </span>

      `;


    flower.addEventListener(
      "click",
      () => {

        if(
          flower.classList.contains(
            "is-bloomed"
          )
        ){

          return;

        }


        flower.classList.add(
          "is-bloomed"
        );


        bloomCount++;


        /* =================================================
           FLOATING ROMANTIC WORD
        ================================================= */

        const word =
          document.createElement(
            "span"
          );


        word.className =
          "bloom-word";


        word.style.left =
          left + "%";


        word.textContent =
          CONFIG.flowers[index].word;


        wordLayer.appendChild(
          word
        );


        setTimeout(
          () => word.remove(),
          2700
        );


        /* =================================================
           UPDATE HINT
        ================================================= */

        if(
          bloomCount < positions.length
        ){

          hint.textContent =
            `${bloomCount} of ${positions.length} have bloomed...`;

        }

        else{

          hint.textContent =
            "all six feelings have bloomed... now make a wish.";

          moon.classList.add(
            "is-ready"
          );

        }


        hint.classList.remove(
          "changed"
        );


        void hint.offsetWidth;


        hint.classList.add(
          "changed"
        );

      }
    );


    flowerbed.appendChild(
      flower
    );

  }
);


/* ============================================================
   HEART MATHEMATICS
============================================================ */

function heartTarget(
  t,
  scale
){

  const x =
    16 *
    Math.pow(
      Math.sin(t),
      3
    );


  const yRaw =

      13 * Math.cos(t)

    - 5 * Math.cos(2*t)

    - 2 * Math.cos(3*t)

    - Math.cos(4*t);


  return {

    x:
      x * scale,

    y:
      -yRaw * scale

  };

}


/* ============================================================
   GATHER FIREFLIES
============================================================ */

function gatherFireflies(){

  const scale =

    Math.max(
      2.8,
      Math.min(
        5.5,
        window.innerWidth * .0055
      )
    );


  fireflies.forEach(
    (f,i) => {

      const t =

        (i /
          fireflies.length)
        *
        Math.PI *
        2;


      const {
        x,
        y
      } =

        heartTarget(
          t,
          scale
        );


      f.style.animation =
        "none";


      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              f.classList.add(
                "is-heart"
              );


              f.style.transition =

                `
                  transform
                  ${
                    prefersReducedMotion
                      ? ".05s"
                      : "2.4s"
                  }
                  cubic-bezier(.3,.7,.2,1)
                `;


              f.style.transform =

                `translate(${x}px,${y}px)`;

            }
          );

        }
      );

    }
  );

}

        C4 20 2 12 8 8
        C12 5.5 16 8 16 12
        C16 8 20 5.5 24 8
        C30 12 28 20 16 28
        Z
      "
      fill="#ffc9dc"
    />
    `,


    `
    <path
      d="
        M16 2
        L19 13
        L30 13
        L21 20
        L24 30
        L16 23
        L8 30
        L11 20
        L2 13
        L13 13
        Z
      "
      fill="#ffe27a"
    />
    `

  ];


  for(
    let i=0;
    i<20;
    i++
  ){

    const piece =
      document.createElement(
        "div"
      );


    piece.className =
      "confetti-piece";


    piece.style.left =
      Math.random()*100 + "%";


    piece.style.setProperty(
      "--dx",
      (
        Math.random()*160 - 80
      ) + "px"
    );


    piece.style.setProperty(
      "--rot",
      (
        Math.random()*720 - 360
      ) + "deg"
    );


    piece.style.animationDelay =
      Math.random()*.8 + "s";


    piece.innerHTML =

      `
      <svg viewBox="0 0 32 32">

        ${shapes[i % 2]}

      </svg>
      `;


    layer.appendChild(
      piece
    );


    setTimeout(
      () => piece.remove(),
      4500
    );

  }

}


/* ============================================================
   MOON / FINAL MOMENT
============================================================ */

const finale =
  document.getElementById(
    "finale"
  );


let finaleShown =
  false;


moon.addEventListener(
  "click",
  () => {

    /* garden unfinished */

    if(
      bloomCount <
      positions.length
    ){

      moon.classList.add(
        "is-shake"
      );


      const previous =
        hint.textContent;


      hint.textContent =
        "not yet... there are still feelings waiting to bloom ♡";


      setTimeout(
        () => {

          moon.classList.remove(
            "is-shake"
          );


          hint.textContent =
            previous;

        },
        1800
      );


      return;

    }


    if(finaleShown){
      return;
    }


    finaleShown =
      true;


    gatherFireflies();


    setTimeout(
      () => {

        finale.classList.add(
          "is-visible"
        );


        launchConfetti();

      },

      prefersReducedMotion
        ? 100
        : 2200

    );

  }
);


/* ============================================================
   REPLAY
============================================================ */

document
  .getElementById(
    "replayBtn"
  )
  .addEventListener(
    "click",
    () => {

      finale.classList.remove(
        "is-visible"
      );


      finaleShown =
        false;


      bloomCount =
        0;


      moon.classList.remove(
        "is-ready"
      );


      hint.textContent =
        "tap the flowers and let them bloom";


      /* reset flowers */

      document
        .querySelectorAll(
          ".flower.is-bloomed"
        )
        .forEach(
          flower =>

            flower.classList.remove(
              "is-bloomed"
            )
        );


      /* reset fireflies */

      fireflies.forEach(
        f => {

          f.classList.remove(
            "is-heart"
          );


          f.style.transition =
            "";


          f.style.transform =
            "";


          f.style.animation =
            "";

        }
      );

    }
  );


/* ============================================================
   ESCAPE
============================================================ */

document.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Escape" &&
      finaleShown
    ){

      finale.classList.remove(
        "is-visible"
      );

    }

  }
);

</script>

</body>
</html>
