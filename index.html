<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Bappa, Saath Saath 🪔</title>

<meta name="theme-color" content="#16070a">
<meta name="description"
content="A little Ganeshotsav corner for two hearts.">

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#120507;
  --bg2:#260b0f;
  --card:rgba(65,18,24,.78);
  --gold:#f4c76b;
  --gold2:#ffe7a8;
  --orange:#e88936;
  --cream:#fff5dd;
  --muted:#c7a99d;
  --red:#bd3c3c;
  --green:#82d394;
  --border:rgba(244,199,107,.18);
  --shadow:0 30px 100px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--cream);
  font-family:Inter,sans-serif;

  background:
    radial-gradient(circle at 20% 0%,
      rgba(184,58,58,.24),
      transparent 32%),
    radial-gradient(circle at 85% 15%,
      rgba(232,137,54,.14),
      transparent 28%),
    linear-gradient(145deg,var(--bg),var(--bg2));

  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.035;

  background-image:
    radial-gradient(#fff 1px,transparent 1px);

  background-size:5px 5px;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.hidden{
  display:none!important;
}

/* =====================================================
   PARTICLES
===================================================== */

.particle{
  position:fixed;
  pointer-events:none;
  z-index:0;

  color:rgba(244,199,107,.3);

  animation:floatParticle linear forwards;
}

@keyframes floatParticle{

  from{
    transform:translateY(110vh) rotate(0deg);
    opacity:0;
  }

  15%{
    opacity:1;
  }

  to{
    transform:translateY(-20vh) rotate(360deg);
    opacity:0;
  }

}

/* =====================================================
   APP
===================================================== */

#app{
  position:relative;
  z-index:1;

  width:min(1080px,100%);
  margin:auto;

  padding:18px;
}

/* =====================================================
   TOPBAR
===================================================== */

.topbar{

  position:sticky;
  top:10px;
  z-index:50;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  padding:11px 15px;
  margin-bottom:18px;

  border:1px solid var(--border);
  border-radius:18px;

  background:rgba(22,6,9,.78);

  backdrop-filter:blur(22px);

  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.brand{

  display:flex;
  align-items:center;
  gap:9px;

  color:var(--gold2);

  font-family:Fraunces,serif;
  font-weight:600;
}

.brand-icon{
  font-size:20px;
}

.status{

  display:flex;
  align-items:center;
  gap:7px;

  color:var(--muted);
  font-size:10px;
}

.status-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#777;
}

.status-dot.ready{
  background:var(--gold);
}

.status-dot.saved{

  background:var(--green);

  box-shadow:0 0 12px var(--green);
}

.status-dot.error{
  background:var(--red);
}

/* =====================================================
   SCREEN
===================================================== */

.screen{
  animation:screenIn .5s ease;
}

@keyframes screenIn{

  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:none;
  }

}

/* =====================================================
   HERO
===================================================== */

.hero{

  min-height:680px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:60px 20px;

  border:1px solid var(--border);
  border-radius:32px;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(244,199,107,.11),
      transparent 32%
    ),
    linear-gradient(
      145deg,
      rgba(91,26,31,.5),
      rgba(20,5,8,.82)
    );

  box-shadow:var(--shadow);
}

.eyebrow{

  color:var(--gold);

  font-size:10px;
  font-weight:700;

  letter-spacing:4px;
  text-transform:uppercase;
}

.hero h1{

  margin:13px 0 12px;

  color:var(--gold2);

  font-family:Fraunces,serif;

  font-size:clamp(45px,9vw,78px);

  line-height:.91;
}

.hero p{

  max-width:580px;

  margin:0 auto 30px;

  color:var(--muted);

  line-height:1.8;
}

/* =====================================================
   GANESH HERO
===================================================== */

.ganesha{

  position:relative;

  width:250px;
  height:250px;

  margin-bottom:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  animation:
    ganeshaFloat 4s ease-in-out infinite;
}

.ganesha:before{

  content:"";

  position:absolute;

  width:210px;
  height:210px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(244,199,107,.22),
      transparent 65%
    );

  filter:blur(5px);

  animation:ganeshaGlow 3s ease-in-out infinite alternate;
}

@keyframes ganeshaFloat{

  50%{
    transform:translateY(-9px);
  }

}

@keyframes ganeshaGlow{

  from{
    transform:scale(.9);
    opacity:.45;
  }

  to{
    transform:scale(1.15);
    opacity:.9;
  }

}

.ganesha svg{

  position:relative;
  z-index:2;

  width:230px;
  height:230px;

  filter:
    drop-shadow(0 12px 25px rgba(0,0,0,.5))
    drop-shadow(0 0 25px rgba(244,199,107,.2));
}

/* =====================================================
   FORM
===================================================== */

.form{
  width:min(550px,100%);
}

.field{
  margin-bottom:14px;
  text-align:left;
}

.field label{

  display:block;

  margin-bottom:7px;

  color:var(--gold2);

  font-size:11px;
  font-weight:600;
}

input,
textarea{

  width:100%;

  color:var(--cream);

  background:rgba(0,0,0,.25);

  border:1px solid var(--border);

  border-radius:14px;

  outline:none;

  padding:14px 16px;

  transition:.2s;
}

input:focus,
textarea:focus{

  border-color:rgba(244,199,107,.6);

  box-shadow:
    0 0 0 3px rgba(244,199,107,.06);
}

.duration-grid{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:7px;
}

.duration{

  padding:11px 5px;

  color:var(--muted);

  background:rgba(0,0,0,.2);

  border:1px solid var(--border);

  border-radius:12px;

  transition:.2s;
}

.duration.active{

  color:#2c1306;

  background:var(--gold);

  border-color:var(--gold);
}

/* =====================================================
   BUTTONS
===================================================== */

.btn{

  width:100%;

  padding:14px 18px;

  border:0;
  border-radius:14px;

  color:#2b1205;

  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );

  font-weight:800;

  box-shadow:
    0 12px 35px rgba(244,199,107,.12);

  transition:.2s;
}

.btn:hover{

  transform:translateY(-2px);

  box-shadow:
    0 18px 45px rgba(244,199,107,.2);
}

.btn.secondary{

  color:var(--gold2);

  background:rgba(255,255,255,.045);

  border:1px solid var(--border);
}

.btn.small{

  width:auto;

  padding:9px 13px;

  font-size:11px;
}

.btn.danger{

  color:#ffd8d8;

  background:rgba(184,58,58,.13);

  border:1px solid rgba(184,58,58,.28);
}

/* =====================================================
   WHO
===================================================== */

.center-screen{

  min-height:78vh;

  display:flex;

  align-items:center;
  justify-content:center;
}

.who-card{

  width:min(700px,100%);

  padding:45px 25px;

  text-align:center;

  border:1px solid var(--border);
  border-radius:28px;

  background:var(--card);

  box-shadow:var(--shadow);
}

.who-card h1{

  margin:10px 0;

  color:var(--gold2);

  font-family:Fraunces,serif;

  font-size:48px;
}

.who-card p{
  color:var(--muted);
}

.person-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

  margin-top:28px;
}

.person{

  padding:30px 18px;

  color:var(--cream);

  background:rgba(255,255,255,.035);

  border:1px solid var(--border);

  border-radius:20px;

  transition:.25s;
}

.person:hover{

  transform:translateY(-5px);

  border-color:
    rgba(244,199,107,.45);
}

.person .emoji{
  font-size:42px;
}

.person strong{

  display:block;

  margin-top:10px;

  color:var(--gold2);

  font-family:Fraunces,serif;

  font-size:23px;
}

.person span{

  display:block;

  margin-top:5px;

  color:var(--muted);

  font-size:11px;
}

/* =====================================================
   DASHBOARD
===================================================== */

.dashboard-header{

  padding:35px 25px;

  text-align:center;

  border:1px solid var(--border);

  border-radius:28px;

  background:
    radial-gradient(
      circle at center top,
      rgba(232,137,54,.13),
      transparent 55%
    ),
    var(--card);
}

.dashboard-header h1{

  margin:11px 0;

  color:var(--gold2);

  font-family:Fraunces,serif;

  font-size:clamp(40px,7vw,66px);

  line-height:.95;
}

.dashboard-header p{
  color:var(--muted);
}

.room-row{

  display:flex;

  justify-content:center;
  align-items:center;

  flex-wrap:wrap;

  gap:8px;

  margin-top:18px;
}

.room-code{

  padding:9px 13px;

  color:var(--gold2);

  background:rgba(244,199,107,.08);

  border:1px solid var(--border);

  border-radius:999px;

  font-size:11px;
}

.grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:16px;

  margin-top:16px;
}

.card{

  padding:24px;

  border:1px solid var(--border);

  border-radius:22px;

  background:var(--card);

  box-shadow:
    0 12px 40px rgba(0,0,0,.16);
}

.card.full{
  grid-column:1/-1;
}

.card h2{

  margin-top:0;

  color:var(--gold2);

  font-family:Fraunces,serif;
}

.card p{

  color:var(--muted);

  line-height:1.7;
}

/* =====================================================
   CENTRAL GANESH MANDAP
===================================================== */

.mandap{

  position:relative;

  min-height:430px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  margin-top:18px;

  border:1px solid var(--border);

  border-radius:28px;

  background:
    radial-gradient(
      circle at center,
      rgba(244,199,107,.13),
      transparent 48%
    ),
    radial-gradient(
      circle at center,
      rgba(184,58,58,.12),
      transparent 70%
    ),
    rgba(18,5,7,.55);
}

.mandap:before{

  content:"";

  position:absolute;

  width:300px;
  height:300px;

  border-radius:50%;

  border:1px solid rgba(244,199,107,.13);

  box-shadow:
    0 0 80px rgba(244,199,107,.08);

  animation:mandalaSpin 25s linear infinite;
}

@keyframes mandalaSpin{

  to{
    transform:rotate(360deg);
  }

}

.mandap-title{

  position:absolute;

  top:20px;

  left:0;
  right:0;

  text-align:center;

  color:var(--gold);

  font-size:10px;

  font-weight:700;

  letter-spacing:4px;

  text-transform:uppercase;
}

.ganesh-center{

  position:relative;

  z-index:3;

  width:270px;
  height:270px;

  display:flex;

  align-items:center;
  justify-content:center;

  animation:
    centerFloat 4s ease-in-out infinite;
}

@keyframes centerFloat{

  50%{
    transform:translateY(-10px);
  }

}

.ganesh-center svg{

  width:260px;
  height:260px;

  filter:
    drop-shadow(0 18px 30px rgba(0,0,0,.5))
    drop-shadow(0 0 35px rgba(244,199,107,.28));
}

/* Aarti */

.mandap-aarti{

  position:absolute;

  left:9%;

  bottom:60px;

  z-index:4;

  width:100px;
  height:100px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(244,199,107,.18),
      rgba(65,18,24,.85)
    );

  border:1px solid rgba(244,199,107,.35);

  animation:
    orbitFloat 3s ease-in-out infinite;
}

.mandap-aarti .icon{

  font-size:45px;

  filter:
    drop-shadow(0 0 15px #f4c76b);
}

.mandap-aarti span{

  margin-top:2px;

  color:var(--gold2);

  font-size:9px;

  font-weight:700;

  letter-spacing:2px;

  text-transform:uppercase;
}

/* Modak */

.mandap-modak{

  position:absolute;

  right:9%;

  bottom:60px;

  z-index:4;

  width:100px;
  height:100px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(232,137,54,.16),
      rgba(65,18,24,.85)
    );

  border:1px solid rgba(244,199,107,.35);

  animation:
    orbitFloat 3.5s ease-in-out infinite;
}

.mandap-modak .icon{

  font-size:42px;

  filter:
    drop-shadow(0 0 12px rgba(232,137,54,.5));
}

.mandap-modak span{

  margin-top:3px;

  color:var(--gold2);

  font-size:9px;

  font-weight:700;

  letter-spacing:2px;

  text-transform:uppercase;
}

@keyframes orbitFloat{

  50%{
    transform:translateY(-7px);
  }

}

/* Flowers */

.flower{

  position:absolute;

  z-index:2;

  font-size:24px;

  animation:flowerFloat 4s ease-in-out infinite;
}

.flower.one{
  top:75px;
  left:20%;
}

.flower.two{
  top:85px;
  right:20%;
  animation-delay:1s;
}

.flower.three{
  bottom:40px;
  left:26%;
  animation-delay:1.5s;
}

.flower.four{
  bottom:42px;
  right:26%;
  animation-delay:.5s;
}

@keyframes flowerFloat{

  50%{
    transform:translateY(-5px) rotate(5deg);
  }

}

/* =====================================================
   DIYA
===================================================== */

.diya-area{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}

.diya{

  padding:25px 15px;

  text-align:center;

  border:1px solid var(--border);

  border-radius:18px;

  background:rgba(0,0,0,.15);

  transition:.3s;
}

.diya.clickable{
  cursor:pointer;
}

.diya.clickable:hover{
  transform:translateY(-4px);
}

.diya.lit{

  background:rgba(244,199,107,.09);

  border-color:
    rgba(244,199,107,.4);
}

.diya-icon{

  font-size:48px;

  filter:grayscale(.8);

  transition:.3s;
}

.diya.lit .diya-icon{

  filter:none;

  animation:
    diyaGlow 1.4s infinite alternate;
}

@keyframes diyaGlow{

  from{
    filter:drop-shadow(0 0 3px #f4c76b);
  }

  to{
    filter:drop-shadow(0 0 20px #f4c76b);
  }

}

.diya strong{

  display:block;

  margin-top:7px;

  color:var(--gold2);
}

.diya small{

  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:10px;
}

/* =====================================================
   MODAK
===================================================== */

.modak-row{

  display:flex;

  align-items:center;
  justify-content:space-between;

  padding:14px 0;

  border-bottom:
    1px solid rgba(255,255,255,.05);
}

.modak-row:last-child{
  border-bottom:0;
}

.modak-name{
  color:var(--gold2);
}

.modak-right{

  display:flex;

  align-items:center;

  gap:12px;
}

.modak-count{

  min-width:35px;

  color:var(--gold2);

  text-align:center;

  font-family:Fraunces,serif;

  font-size:22px;

  font-weight:700;
}

.modak-btn{

  width:38px;
  height:38px;

  border-radius:50%;

  color:var(--gold2);

  background:rgba(255,255,255,.05);

  border:1px solid var(--border);

  font-size:20px;
}

/* =====================================================
   AARTI
===================================================== */

.aarti{

  padding:25px;

  text-align:center;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      rgba(244,199,107,.06),
      transparent
    );
}

.bell{

  width:68px;
  height:68px;

  border-radius:50%;

  color:var(--gold2);

  background:
    rgba(244,199,107,.07);

  border:1px solid var(--border);

  font-size:28px;
}

.bell.ringing{
  animation:ring .5s ease;
}

@keyframes ring{

  20%{
    transform:rotate(12deg);
  }

  40%{
    transform:rotate(-12deg);
  }

  60%{
    transform:rotate(8deg);
  }

  80%{
    transform:rotate(-8deg);
  }

}

.aarti-text{

  margin:20px 0;

  color:var(--gold2);

  font-family:
    "Cormorant Garamond",serif;

  font-size:23px;

  line-height:1.8;
}

/* =====================================================
   NOTES
===================================================== */

.notes-list{

  display:grid;

  gap:10px;

  max-height:420px;

  overflow-y:auto;

  margin-top:15px;
}

.note{

  padding:15px;

  border-radius:15px;

  background:rgba(255,255,255,.035);

  border:1px solid rgba(255,255,255,.04);
}

.note-top{

  display:flex;

  justify-content:space-between;

  gap:10px;

  margin-bottom:7px;
}

.note-name{

  color:var(--gold);

  font-size:12px;

  font-weight:700;
}

.note-time{

  color:#927b72;

  font-size:10px;
}

.note-body{

  color:var(--cream);

  line-height:1.6;

  word-break:break-word;
}

/* =====================================================
   STATS
===================================================== */

.stats{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.stat{

  padding:18px;

  text-align:center;

  border-radius:16px;

  background:rgba(0,0,0,.14);
}

.stat-number{

  display:block;

  color:var(--gold2);

  font-family:Fraunces,serif;

  font-size:30px;

  font-weight:700;
}

.stat-label{

  color:var(--muted);

  font-size:10px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  left:50%;
  bottom:25px;

  z-index:999;

  max-width:90vw;

  padding:12px 18px;

  color:var(--cream);

  background:#321317;

  border:1px solid var(--border);

  border-radius:999px;

  box-shadow:var(--shadow);

  opacity:0;

  transform:
    translateX(-50%)
    translateY(25px);

  pointer-events:none;

  transition:.3s;
}

.toast.show{

  opacity:1;

  transform:
    translateX(-50%);
}

/* =====================================================
   FOOTER
===================================================== */

footer{

  padding:35px 0 20px;

  text-align:center;

  color:#806b63;

  font-size:10px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  #app{
    padding:10px;
  }

  .topbar{
    top:5px;
  }

  .brand span{
    font-size:14px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card.full{
    grid-column:auto;
  }

  .person-grid{
    grid-template-columns:1fr;
  }

  .hero{

    min-height:640px;

    border-radius:23px;
  }

  .dashboard-header{
    border-radius:23px;
  }

  .stats{
    grid-template-columns:
      repeat(3,1fr);
  }

  .stat{
    padding:14px 6px;
  }

  .stat-number{
    font-size:25px;
  }

  .diya-area{
    grid-template-columns:1fr 1fr;
  }

  .room-code{

    max-width:100%;

    overflow:hidden;

    text-overflow:ellipsis;
  }

  .mandap{
    min-height:390px;
  }

  .ganesh-center{
    width:230px;
    height:230px;
  }

  .ganesh-center svg{
    width:220px;
    height:220px;
  }

  .mandap-aarti,
  .mandap-modak{

    width:78px;
    height:78px;
  }

  .mandap-aarti{
    left:4%;
  }

  .mandap-modak{
    right:4%;
  }

  .mandap-aarti .icon,
  .mandap-modak .icon{
    font-size:32px;
  }

function getToday(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}


function createRoomCode(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "BAPPA-";

  for(let i=0;i<6;i++){

    code += chars[
      Math.floor(
        Math.random()*chars.length
      )
    ];
  }

  return code;
}

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function dateDiff(a,b){

  return Math.round(
    (
      new Date(b+"T00:00:00") -
      new Date(a+"T00:00:00")
    ) / 86400000
  );
}


function formatDate(date){

  );
}


/* =====================================================

===================================================== */

function cacheState(){

  if(!state) return;

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );
}


function getCachedState(){

  try{

    const raw =
      localStorage.getItem(STORAGE_KEY);

    return raw
      ? JSON.parse(raw)
      : null;

  }catch{

    return null;
  }
}


/* =====================================================
   FIREBASE ROOM
===================================================== */

function roomRef(){

  if(!state?.roomCode){
    return null;
  }

  return doc(
    db,
    "bappaRooms",
    state.roomCode
  );
}


async function save(){

  if(!state) return;

  cacheState();

  updateStatus(
    "saved",
    "Saving..."
  );

  try{

    await setDoc(
      roomRef(),
      state,
      {
        merge:true
      }
    );

    firebaseReady = true;

    updateStatus(
      "saved",
      "Synced"
    );

  }catch(error){

    console.error(error);

    updateStatus(
      "error",
      "Offline"
    );

    showToast(
      "Saved locally. Firebase sync unavailable."
    );
  }
}


function listenToRoom(){

  if(!state?.roomCode){
    return;
  }

  if(unsubscribeRoom){
    unsubscribeRoom();
  }

  unsubscribeRoom =
    onSnapshot(
      roomRef(),

      snapshot=>{

        if(!snapshot.exists()){
          return;
        }

        const incoming =
          snapshot.data();

        state = {
          ...emptyState(),
          ...incoming,

          checkins:
            incoming.checkins || {},

          modaks:
            incoming.modaks || {
              personA:0,
              personB:0
            },

          notes:
            incoming.notes || [],

          bellCount:
            incoming.bellCount || 0
        };

        cacheState();

        updateStatus(
          "saved",
          "Synced"
        );

        render();

      },

      error=>{

        console.error(
          "Firebase listener:",
          error
        );

        updateStatus(
          "error",
          "Offline"
        );
      }
    );
}

async function loadRoomFromFirebase(code){

  state = {
    ...emptyState(),
    roomCode:code
  };

  await new Promise(resolve=>{

    let done = false;

    const finish = ()=>{
      if(!done){
        done=true;
        resolve();
      }
    };

    const unsubscribe =
      onSnapshot(
        doc(db,"bappaRooms",code),

        snapshot=>{

          if(snapshot.exists()){

            state = {
              ...emptyState(),
              ...snapshot.data(),

              roomCode:code
            };

            cacheState();

            finish();

          }else{

            state = null;

            finish();
          }

          unsubscribe();
        },

        error=>{

          console.error(error);

          finish();
        }
      );
  });

  return !!state;
}

      "ringing"
    );

    void bell.offsetWidth;

    bell.classList.add(
      "ringing"
    );
  }

  showToast(
    "🔔 Aarti bell rang."
  );


  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx =
      new AudioContext();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.setValueAtTime(
      620,
      ctx.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      350,
      ctx.currentTime+.8
    );

    gain.gain.setValueAtTime(
      .0001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .15,
      ctx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      ctx.currentTime+.9
    );

    oscillator.connect(gain);

    gain.connect(
      ctx.destination
    );

    oscillator.start();

    oscillator.stop(
      ctx.currentTime+.9
    );

  }catch{}

}

/* =====================================================
   PARTICLES
===================================================== */

function createParticle(){

  const el =
    document.createElement("div");

  el.className =
    "particle";

  el.textContent =
    Math.random()>.5
      ? "✦"
      : "•";

  el.style.left =
    Math.random()*100+"vw";

  el.style.fontSize =
    8+Math.random()*12+"px";

  const duration =
    8+Math.random()*10;

  el.style.animationDuration =
    duration+"s";

  document.body.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    duration*1000
  );
}


setInterval(
  createParticle,
  1000
);


/* =====================================================
   CONFETTI
===================================================== */

function confetti(){

  for(let i=0;i<70;i++){

    const el =
      document.createElement("div");

    el.textContent =
      Math.random()>.5
        ? "✦"
        : "•";

    el.style.position =
      "fixed";

    el.style.left =
      Math.random()*100+"vw";

    el.style.top =
      "-20px";

    el.style.zIndex =
      "9999";

    el.style.pointerEvents =
      "none";

    el.style.color =
      Math.random()>.5
        ? "#f4c76b"
        : "#e88936";

    el.style.fontSize =
      10+Math.random()*18+"px";

    document.body.appendChild(el);

    const duration =
      1200+Math.random()*1600;

    el.animate(
      [
        {
          transform:
            "translateY(0) rotate(0deg)",
          opacity:1
        },
        {
          transform:
            `translateY(110vh) rotate(${
              Math.random()*720-360
            }deg)`,
          opacity:0
        }
      ],
      {
        duration,
        easing:
          "cubic-bezier(.2,.8,.3,1)"
      }
    ).finished.then(
      ()=>el.remove()
    );
  }
}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      2500
    );
}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(
  type,
  text
){

  const dot =
    document.querySelector(
      ".status-dot"
    );

  const label =
    document.querySelector(
      ".status-label"
    );

  if(!dot || !label)
    return;

  dot.className =
    "status-dot "+type;

  label.textContent =
    text;
}


/* =====================================================
   RENDER
===================================================== */

function render(){

  if(!state){

    renderSetup();

    return;
  }

  if(!currentRole){

    renderWho();

    return;
  }

  renderDashboard();
}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize(){

  state =
    getCachedState();

  currentRole =
    localStorage.getItem(
      ROLE_KEY
    );


  /* Firebase first */

  try{

    await signInAnonymously(
      auth
    );

    firebaseReady = true;

  }catch(error){

    console.error(error);

    firebaseReady = false;
  }


  /* Check room URL */

  const room =
    getRoomFromURL();


  if(room){

    if(firebaseReady){

      const found =
        await loadRoomFromFirebase(
          room
        );

      if(found){

        listenToRoom();

        currentRole =
          localStorage.getItem(
            ROLE_KEY
          );

        if(
          currentRole!=="personA" &&
          currentRole!=="personB"
        ){

          currentRole = null;
        }

        render();

        showToast(
          "Celebration received 🪔"
        );

        return;
      }
    }

    showToast(
      "Couldn't find this celebration."
    );
  }


  if(
    state &&
    currentRole &&
    (
      currentRole==="personA" ||
      currentRole==="personB"
    )
  ){

    if(firebaseReady){

      listenToRoom();
    }

    render();

    return;
  }


  if(state){

    if(firebaseReady){

      listenToRoom();
    }

    renderWho();

    return;
  }


  renderSetup();

}


/* =====================================================
   START
===================================================== */

initialize();

</script>
