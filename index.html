<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cozy Coffee & Cats</title>
<style>
  :root{
    --cream:#FBF3E7;
    --peach:#F6D9C4;
    --lav:#E7DCF2;
    --coat:#FFFFFF;
    --coat-shadow:#E7E4EE;
    --hair:#5B3A52;
    --hair-hi:#7A527A;
    --coffee:#6B4226;
    --coffee-hi:#9C6B41;
    --cat-orange:#E39B54;
    --cat-orange-dark:#C97C36;
    --cat-grey:#9AA0AE;
    --cat-grey-dark:#727889;
    --cat-cream:#F3E7D3;
    --cat-cream-dark:#D8C6A6;
    --book-teal:#5C8A89;
    --book-rose:#C97575;
    --ink:#3E2E3A;
    --heart:#E8879A;
    --gold:#F0C572;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:radial-gradient(ellipse at 50% 20%, var(--lav) 0%, var(--cream) 55%, var(--peach) 100%);
    background-size:140% 140%;
    animation: bgShift 16s ease-in-out infinite alternate;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
  }
  @keyframes bgShift{
    0%{ background-position: 30% 20%; }
    100%{ background-position: 60% 40%; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }

  .stage{ position:relative; width:100vw; height:100vh; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; }

  .lights{ position:absolute; top:0; left:0; right:0; height:60px; display:flex; justify-content:space-evenly; align-items:flex-start; padding-top:14px; pointer-events:none; z-index:2; }
  .lights span{ width:9px; height:9px; border-radius:50%; display:inline-block; box-shadow:0 0 8px 2px currentColor; animation: twinkle 2.6s ease-in-out infinite; }
  .lights span:nth-child(odd){ color:var(--gold); background:var(--gold); margin-top:6px; }
  .lights span:nth-child(even){ color:#F0A8B4; background:#F0A8B4; }
  .lights span:nth-child(3n){ animation-delay:0.6s; }
  .lights span:nth-child(4n){ animation-delay:1.2s; }
  .lights span:nth-child(5n){ animation-delay:1.8s; }
  @keyframes twinkle{ 0%,100%{ opacity:0.35; transform:scale(0.85);} 50%{ opacity:1; transform:scale(1.15);} }

  .petal{ position:absolute; top:-30px; width:10px; height:10px; border-radius:60% 0 60% 0; opacity:0.75; animation-name:petalFall; animation-timing-function:ease-in-out; animation-iteration-count:infinite; z-index:2; }
  @keyframes petalFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    10%{ opacity:0.8; }
    50%{ transform:translate(24px,45vh) rotate(160deg); }
    90%{ opacity:0.5; }
    100%{ transform:translate(-16px,92vh) rotate(320deg); opacity:0; }
  }

  .sparkle{ position:absolute; width:6px; height:6px; border-radius:50%; background:#fff; opacity:0.6; animation:floatUp 6s linear infinite; filter:drop-shadow(0 0 4px #fff); z-index:2; }
  @keyframes floatUp{
    0%{ transform:translateY(0) scale(0.6); opacity:0; }
    10%{ opacity:0.8; }
    90%{ opacity:0.4; }
    100%{ transform:translateY(-70vh) scale(1.1); opacity:0; }
  }

  .title-tag{ position:absolute; top:100px; left:50%; transform:translateX(-50%); font-family:Georgia,'Times New Roman',serif; font-style:italic; color:var(--ink); letter-spacing:1px; font-size:30px; opacity:0.55; z-index:6; }

  .scene{ position:relative; width:min(560px,92vw); height:78vh; animation:sceneBreathe 10s ease-in-out infinite; transform-origin:bottom center; }
  @keyframes sceneBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.015); } }

  .floor-shadow{ position:absolute; bottom:6%; left:50%; width:70%; height:26px; background:radial-gradient(ellipse, rgba(90,60,60,0.18), transparent 70%); transform:translateX(-50%); border-radius:50%; }

  /* ===== GIRL ===== */
  .girl{ position:absolute; bottom:8%; left:50%; transform:translateX(-50%); width:230px; animation:bob 4.5s ease-in-out infinite; z-index:5; }
  @keyframes bob{ 0%,100%{ transform:translateX(-50%) translateY(0);} 50%{ transform:translateX(-50%) translateY(-6px);} }
  .girl svg{ width:100%; height:auto; display:block; overflow:visible; filter:drop-shadow(0 8px 8px rgba(80,50,50,0.15)); }

  .torso-breathe{ transform-origin:115px 275px; animation:breathe 4s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(1.018); } }

  .fabric-sway{ transform-origin:115px 140px; animation:fabricSway 4.6s ease-in-out infinite; }
  @keyframes fabricSway{ 0%,100%{ transform:skewX(-1deg); } 50%{ transform:skewX(1.4deg); } }

  .cup-group{ transform-origin:168px 210px; animation:sip 6s ease-in-out infinite; }
  @keyframes sip{
    0%,12%{ transform:rotate(0deg) translateY(0); }
    18%{ transform:rotate(-38deg) translateY(-10px); }
    26%{ transform:rotate(-38deg) translateY(-10px); }
    34%,100%{ transform:rotate(0deg) translateY(0); }
  }
  .steam path{ animation:steamRise 3s ease-in-out infinite; transform-origin:center bottom; }
  .steam path:nth-child(2){ animation-delay:0.6s; }
  .steam path:nth-child(3){ animation-delay:1.2s; }
  @keyframes steamRise{
    0%{ opacity:0; transform:translateY(4px) scaleY(0.8); }
    30%{ opacity:0.7; }
    100%{ opacity:0; transform:translateY(-14px) scaleY(1.15); }
  }

  .heart-pop{ transform-origin:center; animation:heartPop 6s ease-out infinite; }
  @keyframes heartPop{
    0%,17%{ opacity:0; transform:translateY(0) scale(0.4); }
    20%{ opacity:0.9; transform:translateY(-4px) scale(1); }
    31%{ opacity:0.9; transform:translateY(-10px) scale(1.05); }
    38%,100%{ opacity:0; transform:translateY(-20px) scale(1.1); }
  }

  .eyes{ animation:blink 4.2s infinite, eyesFadeForSip 6s infinite; transform-origin:center; }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1); } 95%{ transform:scaleY(0.08); } }
  @keyframes eyesFadeForSip{ 0%,15%{ opacity:1; } 19%,31%{ opacity:0; } 35%,100%{ opacity:1; } }
  .eyes-happy{ opacity:0; animation:eyesHappyFade 6s infinite; }
  @keyframes eyesHappyFade{ 0%,15%{ opacity:0; } 19%,31%{ opacity:1; } 35%,100%{ opacity:0; } }

  .blush{ animation:blushPulse 5s ease-in-out infinite; }
  @keyframes blushPulse{ 0%,100%{ opacity:0.4; } 50%{ opacity:0.7; } }

  .book-group{ animation:bookSway 5s ease-in-out infinite; transform-origin:70px 205px; }
  @keyframes bookSway{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg); } }
  .page-flip{ transform-origin:23px 17px; animation:pageFlip 4s ease-in-out infinite; }
  @keyframes pageFlip{ 0%,40%{ transform:scaleX(1); } 50%{ transform:scaleX(0.1); } 60%,100%{ transform:scaleX(1); } }

  .hair-strand{ animation:strandSway 3.4s ease-in-out infinite; transform-origin:top center; }
  @keyframes strandSway{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(3deg); } }
  .ahoge{ transform-origin:bottom center; animation:ahogeWiggle 2.4s ease-in-out infinite; }
  @keyframes ahogeWiggle{ 0%,100%{ transform:rotate(-6deg); } 50%{ transform:rotate(8deg); } }

  /* ===== CATS ===== */
  .cat{ position:absolute; width:70px; z-index:4; }
  .cat svg{ width:100%; display:block; overflow:visible; filter:drop-shadow(0 4px 5px rgba(80,50,50,0.12)); }

  .cat-tail{ animation:tailFlick 1.1s ease-in-out infinite; transform-origin:bottom center; }
  @keyframes tailFlick{
    0%{ transform:rotate(-14deg) scaleY(1); }
    30%{ transform:rotate(10deg) scaleY(1.05); }
    60%{ transform:rotate(-18deg) scaleY(0.98); }
    100%{ transform:rotate(-14deg) scaleY(1); }
  }

  .ear-twitch{ transform-origin:bottom center; animation:earTwitch 3.2s ease-in-out infinite; }
  @keyframes earTwitch{ 0%,88%,100%{ transform:rotate(0deg); } 91%{ transform:rotate(-10deg); } 94%{ transform:rotate(6deg); } }

  .whiskers{ animation:whiskerTwitch 2.8s ease-in-out infinite; }
  @keyframes whiskerTwitch{ 0%,100%{ opacity:0.55; } 50%{ opacity:0.9; } }

  .paw-a{ animation:pawA 0.42s ease-in-out infinite; }
  .paw-b{ animation:pawB 0.42s ease-in-out infinite; }
  @keyframes pawA{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
  @keyframes pawB{ 0%,100%{ transform:translateY(-4px); } 50%{ transform:translateY(0); } }

  .cat-body-run{ animation:catRun 0.3s steps(2) infinite; }
  @keyframes catRun{ 0%{ transform:translateY(0); } 100%{ transform:translateY(-3px); } }

  .cat--orange{ animation:orbitOrange 9s ease-in-out infinite; bottom:10%; left:50%; }
  @keyframes orbitOrange{
    0%{ transform:translate(-160px,10px) scale(1) scaleX(1); }
    18%{ transform:translate(-90px,-6px) scale(1.02) scaleX(1); }
    24%{ transform:translate(-75px,-34px) scale(1.05) scaleX(1); }
    30%{ transform:translate(-75px,-8px) scale(1.02) scaleX(1); }
    32%{ transform:translate(-75px,-8px) scale(1.02) scaleX(-1); }
    48%{ transform:translate(-160px,10px) scale(1) scaleX(-1); }
    50%{ transform:translate(-160px,10px) scale(1) scaleX(1); }
    100%{ transform:translate(-160px,10px) scale(1) scaleX(1); }
  }

  .cat--grey{ animation:pounceGrey 3.6s ease-in-out infinite; bottom:9%; right:6%; left:auto; }
  @keyframes pounceGrey{
    0%,100%{ transform:translate(60px,0) rotate(0deg) scale(1,1); }
    16%{ transform:translate(52px,-46px) rotate(-12deg) scale(0.95,1.05); }
    30%{ transform:translate(40px,0) rotate(4deg) scale(1.15,0.82); }
    36%{ transform:translate(40px,0) rotate(0deg) scale(1,1); }
  }

  .cat--cream{ bottom:6.5%; left:8%; animation:rollCream 7s ease-in-out infinite; }
  @keyframes rollCream{
    0%,15%{ transform:translate(0,0) rotate(0deg) scaleX(1) scaleY(1); }
    35%{ transform:translate(10px,-2px) rotate(-14deg) scaleX(1.18) scaleY(0.88); }
    55%{ transform:translate(14px,-4px) rotate(-10deg) scaleX(1.18) scaleY(0.88); }
    75%{ transform:translate(6px,0) rotate(2deg) scaleX(1) scaleY(1); }
    100%{ transform:translate(0,0) rotate(0deg) scaleX(1) scaleY(1); }
  }

  .cat--kitten{ bottom:11%; left:22%; width:46px; animation:dartKitten 4.4s ease-in-out infinite; }
  @keyframes dartKitten{
    0%,100%{ transform:translateX(0) scaleX(1); }
    45%{ transform:translateX(120px) scaleX(1); }
    50%{ transform:translateX(120px) scaleX(-1); }
    95%{ transform:translateX(0) scaleX(-1); }
  }

  .yarn{ position:absolute; bottom:12.5%; left:22%; width:20px; z-index:4; filter:drop-shadow(0 3px 3px rgba(80,50,50,0.12)); animation:yarnBounce 4.4s ease-in-out infinite; }
  @keyframes yarnBounce{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    22%{ transform:translate(70px,-10px) rotate(120deg); }
    45%{ transform:translate(132px,0) rotate(240deg); }
    50%{ transform:translate(132px,0) rotate(260deg); }
    72%{ transform:translate(70px,-10px) rotate(380deg); }
    95%{ transform:translate(0,0) rotate(480deg); }
  }

  .side-book{ position:absolute; width:54px; z-index:3; filter:drop-shadow(0 4px 4px rgba(0,0,0,0.12)); }
  .side-book--1{ bottom:5%; left:14%; animation:bookJiggle1 4s ease-in-out infinite; }
  .side-book--2{ bottom:4%; left:20%; animation:bookJiggle2 4.6s ease-in-out infinite; animation-delay:0.8s; }
  @keyframes bookJiggle1{ 0%,100%{ transform:rotate(-8deg) translateY(0); } 50%{ transform:rotate(-6deg) translateY(-2px); } }
  @keyframes bookJiggle2{ 0%,100%{ transform:rotate(6deg) translateY(0); } 50%{ transform:rotate(8deg) translateY(-2px); } }

  .butterfly{ position:absolute; top:30%; left:20%; width:26px; z-index:6; filter:drop-shadow(0 2px 3px rgba(80,50,50,0.15)); animation:butterflyPath 12s ease-in-out infinite; }
  @keyframes butterflyPath{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(120px,-30px); }
    40%{ transform:translate(220px,20px); }
    60%{ transform:translate(160px,90px); }
    80%{ transform:translate(60px,60px); }
    100%{ transform:translate(0,0); }
  }
  .wing-l,.wing-r{ animation:flap 0.32s ease-in-out infinite alternate; transform-origin:center; }
  .wing-r{ animation-delay:0.02s; }
  @keyframes flap{ 0%{ transform:scaleX(1); } 100%{ transform:scaleX(0.35); } }

  .caption{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); color:var(--ink); opacity:0.5; font-size:12px; letter-spacing:2px; text-transform:uppercase; z-index:6; }
</style>
</head>
<body>
<div class="stage">
  <div class="lights">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="title-tag">Look at you, college postgraduate! All those late-night books, illegal coffee, and your spiritual animal—the cat—finally paid off. I’m the luckiest guy to have you this close to my heart.</div>

  <div class="petal" style="left:10%; background:var(--heart); animation-duration:9s; animation-delay:0s;"></div>
  <div class="petal" style="left:30%; background:var(--gold); animation-duration:11s; animation-delay:2s;"></div>
  <div class="petal" style="left:55%; background:var(--heart); animation-duration:8s; animation-delay:4s;"></div>
  <div class="petal" style="left:75%; background:var(--gold); animation-duration:10s; animation-delay:1s;"></div>
  <div class="petal" style="left:90%; background:var(--heart); animation-duration:9.5s; animation-delay:3s;"></div>
  <div class="petal" style="left:45%; background:var(--gold); animation-duration:12s; animation-delay:5s;"></div>

  <div class="sparkle" style="left:12%; animation-delay:0s;"></div>
  <div class="sparkle" style="left:28%; animation-delay:1.5s;"></div>
  <div class="sparkle" style="left:70%; animation-delay:3s;"></div>
  <div class="sparkle" style="left:85%; animation-delay:2.1s;"></div>
  <div class="sparkle" style="left:50%; animation-delay:4.2s;"></div>

  <svg class="butterfly" viewBox="0 0 30 24">
    <ellipse class="wing-l" cx="10" cy="10" rx="9" ry="7" fill="#F0A8B4" opacity="0.85"/>
    <ellipse class="wing-r" cx="20" cy="10" rx="9" ry="7" fill="#F0C572" opacity="0.85"/>
    <rect x="14" y="6" width="2" height="14" rx="1" fill="var(--ink)"/>
  </svg>

  <div class="scene">
    <div class="floor-shadow"></div>

    <svg class="side-book side-book--1" viewBox="0 0 60 44">
      <rect x="2" y="6" width="56" height="32" rx="3" fill="var(--book-rose)"/>
      <rect x="6" y="10" width="48" height="24" rx="1" fill="#FBF3E7"/>
    </svg>
    <svg class="side-book side-book--2" viewBox="0 0 60 44">
      <rect x="2" y="6" width="56" height="32" rx="3" fill="var(--book-teal)"/>
      <rect x="6" y="10" width="48" height="24" rx="1" fill="#FBF3E7"/>
    </svg>

    <svg class="yarn" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="9" fill="var(--book-rose)"/>
      <path d="M2 10 Q10 2 18 10 Q10 18 2 10" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.6"/>
      <path d="M4 4 Q10 12 16 4" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
    </svg>

    <!-- ===== GIRL ===== -->
    <div class="girl">
      <svg viewBox="0 0 230 280">
        <g class="torso-breathe">
        <g class="fabric-sway">
          <path d="M55 190 Q40 260 60 275 L170 275 Q190 260 175 190 Q170 140 115 135 Q60 140 55 190 Z" fill="var(--coat)" stroke="var(--coat-shadow)" stroke-width="2"/>
          <path d="M100 150 L88 250 L112 235 L118 150 Z" fill="var(--coat-shadow)" opacity="0.5"/>
          <path d="M130 150 L142 250 L118 235 L112 150 Z" fill="var(--coat-shadow)" opacity="0.5"/>
          <circle cx="115" cy="195" r="3" fill="#C9BFAF"/>
          <circle cx="115" cy="215" r="3" fill="#C9BFAF"/>
          <circle cx="115" cy="235" r="3" fill="#C9BFAF"/>
        </g>
        </g>

        <g class="book-group">
          <path d="M60 195 Q35 210 40 235 Q45 250 70 245 L75 205 Z" fill="var(--coat)" stroke="var(--coat-shadow)" stroke-width="2"/>
          <g transform="translate(18,220) rotate(-14)">
            <rect x="0" y="0" width="46" height="34" rx="3" fill="var(--book-teal)"/>
            <rect x="4" y="4" width="38" height="26" rx="1" fill="#FBF3E7"/>
            <rect class="page-flip" x="23" y="4" width="19" height="26" fill="#FBF3E7" stroke="var(--book-teal)" stroke-width="0.6"/>
            <line x1="23" y1="4" x2="23" y2="30" stroke="var(--book-teal)" stroke-width="1.5"/>
          </g>
        </g>

        <path d="M170 195 Q195 205 190 228 Q186 244 165 240 L158 202 Z" fill="var(--coat)" stroke="var(--coat-shadow)" stroke-width="2"/>
        <g class="cup-group">
          <g class="steam" transform="translate(160,178)">
            <path d="M0 10 C -4 4, 2 0, 0 -6" stroke="#B9A79A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" transform="translate(-4,0)"/>
            <path d="M0 10 C -4 4, 2 0, 0 -6" stroke="#B9A79A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" transform="translate(2,-2)"/>
            <path d="M0 10 C -4 4, 2 0, 0 -6" stroke="#B9A79A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" transform="translate(8,1)"/>
          </g>
          <path d="M152 198 h24 l-3 26 q-1 8 -9 8 h-0 q-8 0 -9 -8 Z" fill="var(--coffee-hi)"/>
          <path d="M155 200 h18 l-2 5 h-14 Z" fill="var(--coffee)"/>
          <path d="M176 205 q10 -2 9 7 q-1 8 -10 6" fill="none" stroke="var(--coffee-hi)" stroke-width="3"/>
        </g>

        <rect x="103" y="118" width="24" height="24" rx="8" fill="#FBD9C4"/>
        <ellipse cx="115" cy="90" rx="52" ry="50" fill="#FCE1CC"/>

        <path d="M63 80 Q55 140 75 175 Q65 130 70 90 Z" fill="var(--hair)"/>
        <path d="M167 80 Q175 140 155 175 Q165 130 160 90 Z" fill="var(--hair)"/>

        <path d="M63 95 Q55 40 115 32 Q175 40 167 95 Q160 55 115 55 Q70 55 63 95 Z" fill="var(--hair)"/>
        <path class="hair-strand" d="M92 45 Q85 70 90 95" stroke="var(--hair-hi)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path class="hair-strand" d="M140 45 Q147 70 142 95" stroke="var(--hair-hi)" stroke-width="5" fill="none" stroke-linecap="round" style="animation-delay:0.4s"/>
        <path class="hair-strand" d="M78 60 Q72 85 76 105" stroke="var(--hair)" stroke-width="4" fill="none" stroke-linecap="round" style="animation-delay:0.9s"/>
        <path class="hair-strand" d="M154 60 Q160 85 156 105" stroke="var(--hair)" stroke-width="4" fill="none" stroke-linecap="round" style="animation-delay:1.3s"/>
        <path class="ahoge" d="M112 34 Q108 18 116 8" stroke="var(--hair)" stroke-width="4" fill="none" stroke-linecap="round"/>

        <circle cx="63" cy="95" r="7" fill="#FCE1CC"/>
        <circle cx="167" cy="95" r="7" fill="#FCE1CC"/>

        <path d="M89 76 Q97 72 105 76" stroke="var(--hair)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M125 76 Q133 72 141 76" stroke="var(--hair)" stroke-width="2.6" fill="none" stroke-linecap="round"/>

        <g class="eyes">
          <ellipse cx="98" cy="92" rx="7" ry="10" fill="var(--ink)"/>
          <ellipse cx="132" cy="92" rx="7" ry="10" fill="var(--ink)"/>
          <circle cx="100" cy="88" r="2.2" fill="#fff"/>
          <circle cx="134" cy="88" r="2.2" fill="#fff"/>
        </g>
        <g class="eyes-happy">
          <path d="M91 92 Q98 85 105 92" stroke="var(--ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <path d="M125 92 Q132 85 139 92" stroke="var(--ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </g>
        <text class="heart-pop" x="147" y="70" font-size="18" fill="var(--heart)">&#9825;</text>

        <ellipse class="blush" cx="90" cy="108" rx="7" ry="4" fill="#F5A6A0"/>
        <ellipse class="blush" cx="140" cy="108" rx="7" ry="4" fill="#F5A6A0"/>
        <path d="M108 112 Q115 118 122 112" stroke="var(--ink)" stroke-width="2.4" fill="none" stroke-linecap="round"/>

        <path d="M63 95 Q68 60 100 50 Q75 65 72 100 Z" fill="var(--hair)"/>
        <path d="M167 95 Q162 60 130 50 Q155 65 158 100 Z" fill="var(--hair)"/>
      </svg>
    </div>

    <!-- ===== CATS ===== -->
    <div class="cat cat--orange">
      <svg viewBox="0 0 90 60">
        <path class="cat-tail" d="M78 40 Q95 30 88 12" stroke="var(--cat-orange-dark)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <g class="cat-body-run">
          <ellipse cx="42" cy="40" rx="30" ry="16" fill="var(--cat-orange)"/>
          <circle cx="16" cy="30" r="14" fill="var(--cat-orange)"/>
          <g class="ear-twitch"><path d="M8 20 L12 8 L18 20 Z" fill="var(--cat-orange)"/></g>
          <g class="ear-twitch" style="animation-delay:0.5s"><path d="M22 20 L26 8 L30 20 Z" fill="var(--cat-orange)"/></g>
          <circle cx="12" cy="30" r="2" fill="var(--ink)"/>
          <circle cx="20" cy="30" r="2" fill="var(--ink)"/>
          <g class="whiskers" stroke="var(--cat-orange-dark)" stroke-width="1">
            <line x1="2" y1="32" x2="-8" y2="29"/>
